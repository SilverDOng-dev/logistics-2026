<script>
'use strict';
const VERSION='qfresh-wms-1.0';
const PANELS={inv:['WMS 재고','창고운영팀'],pick:['WMS 피킹','창고운영팀'],io:['WMS 입출고','입고팀 · 이동 기록 포함'],wes:['WES 작업','관제팀'],wcs:['WCS 설비','설비팀'],tms:['TMS 배차','배송운영팀'],app:['APP 고객앱','CS팀']};
const COLS={inv:['SKU','ITEM','LOC','QTY_SYS','LAST_MOVE','LAST_COUNT'],pick:['ORDER_NO','SKU','LOC','PICK_STATUS','PICK_SCAN','TOTE','PICKER'],io:['DOC_NO','TYPE','SKU','QTY','LOC','STATUS','TIME'],wes:['ORDER_NO','TASK','TASK_STATUS','LINE','UPDATED'],wcs:['LINE','STATUS','ALARM','SINCE'],tms:['ORDER_NO','VEH_ASSIGN','DOCK_LOAD_SCAN','DRIVER_DEPART'],app:['ORDER_NO','DISPLAY_STATUS','DISPLAY_TIME']};
const MSGS=['창고운영팀 야간 당직 인수. 오늘 물량 4,200건. 우리 팀 화면은 WMS 세 개(재고·피킹·입출고)다. 나머지는 참고만.','WMS는 기록하는 시스템이다. 실물이 어디 있는지는 기록이 말해주지, 보여주지는 않는다. 기록과 실물이 다를 때 그걸 찾는 게 우리 일이다.','지금 기록으로 무엇까지 알 수 있고, 무엇을 더 확인해야 하나 — 그게 우리가 답할 전부다.'];
const CASES=[
{id:'C1',time:'00:40',title:'B-07에 생수가 없어요',from:'피커 김민재',short:'비어 있는 피킹 위치',minutes:4,guide:true,data:{inv:[['W-2L06','생수 2L×6','B-07',120,'전일 22:10','3일 전']],pick:[['Q-24471','W-2L06','B-07','대기','—','—','김민재']],io:[['R-8813','반품입고','W-2L06',24,'B-07','전산완료','전일 22:10']],wes:[['Q-24471','피킹','지시 대기','—','00:39']],wcs:[['관련 라인','정상','없음','00:40']],tms:[['Q-24471','배정 전','없음','없음']],app:[['Q-24471','상품 준비 중','00:39']]},result:'B-07 상단 선반에 생수 96개가 있습니다. 피커는 하단만 확인했습니다.\n반품 24개는 전산 입고 처리됐지만 검수대 R-2에서 검수 미완료로 보류 중입니다. 전체 실물은 120개(96+24)이며, 출고 가능한 수량은 96개입니다.',builtin:['B-07 재고 수량, 마지막 이동 기록, 반품입고 기록을 함께 읽어보면 어떨까? 네가 열어본 칸에서 근거를 골라보자.','피커의 호출과 전산 수량이 다르게 보이네. 어느 선반을 확인했는지와 입고 처리 범위를 질문할 수 있어. 아직 수량을 확정할 근거는 충분할까?','지금 요청할 확인과 그 결과에 따른 조치를 나눠 적어보자. 네가 고른 기록 중 어떤 것이 조치의 근거인지도 연결해줘.']},
{id:'C2',time:'01:30',title:'A-12에 다른 상품이 있어요',from:'피커 / 이동 작업 확인 요청',short:'엇갈린 이동 기록',minutes:5,data:{inv:[['Y-450','요거트 세트','A-12',60,'전일 18:00','전일 20:00'],['S-900','두유 세트','A-12',60,'전일 22:08','전일 20:00']],pick:[['Q-24388','Y-450','A-12','대기','—','—','박서연']],io:[['M-3320','로케이션 이동','Y-450',60,'A-12 → A-15','실물완료·전산대기','전일 22:05'],['M-3321','로케이션 이동','S-900',60,'A-15 → A-12','전산완료','전일 22:08']],wes:[['Q-24388','요거트 피킹 A-12','지시 대기','1','01:29']],wcs:[['1','정상','없음','01:30']],tms:[['Q-24388','배정 전','없음','없음']],app:[['Q-24388','상품 준비 중','01:29']]},result:'A-12에는 두유 60개, A-15에는 요거트 60개가 있습니다. 두 이동 건 모두 실물 이동이 완료됐습니다.\nM-3320의 전산 처리 누락으로 요거트가 A-12에 남아 표시됩니다. M-3321의 두유 위치는 정상 반영됐습니다. 작업자·실물·이동 문서를 확인한 후 M-3320을 처리하고 피킹 지시 위치를 동기화합니다.',builtin:['같은 로케이션에 두 SKU가 표시되는 것만으로 오류를 확정할 수 있을까? 이동 문서의 출발지·도착지와 처리 상태를 각각 연결해봐.','두 이동 건의 전산 상태가 같은지 비교해보자. 이동 기록에 적힌 상태와 실제 현장 확인은 구분해서 적으면 좋겠어.','이동을 다시 시키는 것과 빠진 전산 기록을 처리하는 것은 다른 조치야. 어떤 확인 결과일 때 어느 조치를 할지 조건을 붙여봐.']},
{id:'C3',time:'02:50',title:'피킹완료인데 토트 내용물이 지시와 달라요',from:'WES 관제 / 포장 작업대',short:'스캔 이후의 실물',minutes:5,data:{inv:[['Y-450','요거트 세트','A-15',59,'02:31','전일 20:00'],['S-900','두유 세트','A-12',59,'02:32','전일 20:00']],pick:[['Q-24388','Y-450','A-15','완료','02:31','T-118','박서연'],['Q-24389','S-900','A-12','완료','02:32','T-118','박서연']],io:[['Q-24388','출고','Y-450',1,'A-15','출고 전','02:31'],['Q-24389','출고','S-900',1,'A-12','출고 전','02:32']],wes:[['Q-24388','포장','대기','1','02:49'],['Q-24389','포장','대기','2','02:49']],wcs:[['1','정상','없음','02:50'],['2','정상','없음','02:50']],tms:[['Q-24388','배정 전','없음','없음'],['Q-24389','배정 전','없음','없음']],app:[['Q-24388','상품 준비 중','02:32'],['Q-24389','상품 준비 중','02:33']]},result:'T-118에는 두유 1세트만 있습니다. 요거트는 A-15 선반에 그대로 있습니다(스캔 후 미투입). 선반 실사는 요거트 60개, 두유 59개입니다.\n토트 교체 누락으로 두 주문이 같은 토트에 연결됐습니다. Q-24388의 피킹 예외를 처리한 뒤 재피킹하고, 토트 연결을 분리합니다. 재처리 시 이중 재고 차감이 생기지 않도록 확인합니다.',builtin:['두 주문의 토트 번호, 스캔 시각, 포장 라인을 함께 비교해보자. 기록에서 서로 연결되는 값이 있니?','피킹완료 기록과 토트의 실제 내용물은 각각 어떤 증거로 확인할 수 있을까? 작업자에게 물을 내용도 정해봐.','재피킹을 선택한다면 기존 스캔과 재고 차감을 어떻게 처리할지도 확인해야겠어. 확인할 대상과 후속 조치를 연결해줘.']},

function simpleTable(cols,rows){return `<div class="tablewrap"><table><thead><tr>${cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function workspace(){const i=S.current,c=CASES[i],d=S.cases[i];if(timerCase!==i){elapsedStart=Date.now();timerCase=i;}return `<div class="workspace"><aside class="rail"><div class="card"><p class="eyebrow">CALL QUEUE</p><h3>호출 ${S.cases.filter(x=>x.done).length} / 4 완료</h3>${CASES.map((x,j)=>`<button class="queue ${i===j?'active':''}" data-act="case" data-i="${j}" ${j>0&&!S.cases[j-1].done?'disabled':''}><span>${x.id} · ${x.archive?'01:15 기록 재검토':x.time}</span><strong>${x.short}</strong><span class="${S.cases[j].done?'ok':'muted'}">${S.cases[j].done?'복기 완료':j===0?'안내형 · 4분':'독립 판단 · 5분'}</span></button>`).join('')}</div><div class="card"><p class="eyebrow">SYSTEM PANELS</p><p class="help">값을 눌러 판단 근거에 담으세요.</p><div class="panels">${Object.entries(PANELS).map(([k,p])=>`<button class="panelbtn ${d.panel===k?'active':''}" data-act="panel" data-key="${k}">${p[0]}<span class="mark">${d.opened.includes(k)?'열람':''}</span></button>`).join('')}</div></div></aside><section class="work"><div class="card call"><div class="flex between"><p class="eyebrow">${c.id} / ${c.guide?'GUIDED CASE':'YOUR DECISION'}</p><span class="timer" id="timer"></span></div><h1>“${esc(c.title)}”</h1><p class="muted">${esc(c.from)} · 조회 기준 ${c.time}</p>${c.archive?'<div class="notice">시간을 되돌려 검토하는 호출입니다. 모든 패널은 01:15에 보였던 기록이며, 확정 후 사후 경과를 확인합니다.</div>':i===2?'<p class="help">이 사례는 C2의 이동 기록을 정리한 뒤의 상황으로 시작합니다. 이전에 선택한 조치와 관계없이 동일한 자료를 제공합니다.</p>':''}${c.guide?'<p class="help">WMS 패널 세 개가 순서대로 열립니다. 다시 열어 비교하고, 회색 예시를 참고해 자신의 판단을 작성하세요.</p>':''}</div><div id="panelarea">${panelHTML(i)}</div><div class="card"><h2>당직자의 판단</h2>${d.locked?'<div class="notice">확정된 판단입니다. 아래 현장 결과와 비교해 복기를 남기세요.</div>':''}<div class="formpart"><h3><span>01</span>기록으로 확인한 사실</h3><p class="help">패널 표의 값을 선택하면 패널·열·값이 함께 기록됩니다. 복수 선택할 수 있습니다.</p><div id="facts">${factsHTML(i)}</div></div><div class="formpart"><h3><span>02</span>아직 확인되지 않은 점</h3><label>무엇을 확인해야 하나${area(`cases.${i}.unknown`,c.guide?'예: 호출에서 확인한 선반 범위와 반품 실물의 현재 위치를 확인해야 한다.':'확인한 사실과 아직 모르는 것을 구분해 적으세요.',d.locked)}</label><label>어디서 확인할 것인가</label>${checks(`cases.${i}.where`,['현장','검수대','작업자','다른 패널'],d.locked)}<div class="grid2"><label>현재 판단한 실물 위치${select(`cases.${i}.location`,['현재 자료로 알 수 없음','현장 확인 전 추정','기록상 위치만 확인'],d.locked)}</label><label>현재 판단한 수량${input(`cases.${i}.quantity`,'현재 자료로 알 수 없음 또는 근거 있는 추정', 'text',d.locked)}</label></div><label>WMS 오류 판단${select(`cases.${i}.error`,['판단 보류','오류 없음','오류 의심'],d.locked)}</label><label>의심되는 필드 (해당할 때 복수 선택)</label>${checks(`cases.${i}.errorFields`,['재고.LOC','재고.QTY_SYS','피킹.PICK_STATUS','피킹.TOTE','입출고.STATUS','해당 없음'],d.locked)}<label>판단의 근거${area(`cases.${i}.errorNote`,c.guide?'예: 전산 수량과 피커의 호출이 다르지만 실사 전에는 어떤 필드가 틀렸는지 확정하기 어렵다.':'오류 없음·판단 보류를 선택한 이유도 적으세요.',d.locked)}</label></div><div class="formpart"><h3><span>03</span>조건을 붙인 조치</h3><label>지금 할 일</label>${checks(`cases.${i}.now`,ACTIONS,d.locked)}<label>담당자에게 보낼 지시${area(`cases.${i}.nowNote`,c.guide?'예: 피커에게 확인 범위를 묻고 현장 및 검수대 확인을 요청한다.':'누구에게 무엇을 확인하거나 처리하도록 할 것인가?',d.locked)}</label><label>확인 결과가 무엇이면? <span class="warn">필수</span>${area(`cases.${i}.condition`,c.guide?'예: 반품 수량이 검수대 보류품이며 B-07에 없다는 것이 확인되면…':'후속 조치를 실행할 조건을 적으세요.',d.locked)}</label><label>그때 할 일</label>${checks(`cases.${i}.later`,ACTIONS,d.locked)}<label>조건 충족 후 지시${area(`cases.${i}.laterNote`,c.guide?'예: 담당자에게 보류 재고와 가용 재고를 구분해 기록하도록 요청한다.':'기록 변경·재작업·이관의 범위와 순서를 적으세요.',d.locked)}</label></div>${d.locked?'':`<button class="primary spacer" data-act="confirm">결정 확정 · 현장 결과 열기</button><p class="help spacer">확정 후에는 최초 판단을 바꿀 수 없습니다. 수정할 내용은 복기에 남깁니다.</p>`}</div>${d.locked?reflection(i):''}</section><aside class="ai">${aiHTML()}</aside></div>`;}
function panelHTML(i){const d=S.cases[i],c=CASES[i],k=d.panel;if(!k)return '<div class="card"><p class="eyebrow">EVIDENCE DESK</p><h2>먼저 기록을 열어보세요.</h2><p class="muted">왼쪽 패널 목록에서 조회할 시스템을 고르세요. 아직 열지 않은 패널은 AI에게 전달되지 않습니다.</p></div>';return `<div class="card"><div class="flex between"><h2>${PANELS[k][0]}</h2><span class="chip">조회 기준 ${c.time}</span></div><p class="help">${PANELS[k][1]} · ${k==='inv'?'수량 단위: SKU 포장단위(세트/묶음)':'당직 조회 기록'}</p><div class="tablewrap"><table><thead><tr>${COLS[k].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${c.data[k].map((row,r)=>`<tr>${row.map((v,col)=>`<td><button class="cell ${d.facts.some(f=>f.key===`${k}:${r}:${col}`)?'selected':''}" data-act="fact" data-key="${k}" data-row="${r}" data-col="${col}" aria-label="근거 선택: ${esc(COLS[k][col])} ${esc(v)}" ${d.locked?'disabled':''}>${esc(v)}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="help">표의 값을 클릭하면 아래 ‘확인한 사실’에 담깁니다.${k==='io'?' STATUS는 전산 처리 상태와 실물 작업 상태를 함께 확인하세요.':''}</p></div>`;}
function factsHTML(i){const d=S.cases[i];return d.facts.length?d.facts.map((f,j)=>`<div class="fact">${!d.locked?`<button class="small" data-act="removeFact" data-i="${j}" aria-label="근거 삭제">삭제</button>`:''}${esc(PANELS[f.panel][0])} · ${esc(f.column)} = <strong>${esc(f.value)}</strong><br><span class="muted">${esc(f.rowContext)}</span></div>`).join(''):'<p class="help">선택한 근거가 없습니다. 패널에서 최소 한 개의 값을 선택하세요.</p>';}
function reflection(i){const d=S.cases[i];return `<div class="card result"><p class="eyebrow">FIELD CHECK / 현장 확인 결과</p><p>${esc(CASES[i].result)}</p></div><div class="card"><h2>판단을 돌아보기</h2><label>맞은 것 · 근거가 있었던 판단${area(`cases.${i}.right`,'기록과 현장 결과가 어떻게 연결되는지 적으세요.',d.done)}</label><label>놓친 것 · 다음에 바꿀 판단${area(`cases.${i}.missed`,'없다면 왜 현재 판단을 유지하는지 적으세요.',d.done)}</label>${i===2?`<label>호출자의 말 중 확인 없이 받아들인 것이 있는가${area(`cases.${i}.caller`,'있었다면 무엇인지, 없었다면 어떤 근거로 확인했는지 적으세요.',d.done)}</label>`:''}<button class="primary spacer" data-act="finishCase">${d.done?'다음 단계로':i===3?'복기 완료 · 아침 보고로':'복기 완료 · 다음 호출'}</button></div>`;}
function aiHTML(){const i=activeAi,d=S.cases[i];return `<section class="card chat"><p class="eyebrow">AI COLLEAGUE</p><div class="flex between"><h2>당직 동료</h2><span class="chip">${S.mode==='builtin'?'내장 모드':'외부 LLM'}</span></div><p class="help">전체 활동 중 답변 1개 이상을 검토하고 채택·수정·기각 이유를 남기세요.</p><label>사용 방식${select('mode',['external','builtin'])}</label><div class="tabs">${CASES.map((c,j)=>`<button class="small ${i===j?'active':''}" data-act="aiTab" data-i="${j}" ${j>0&&!S.cases[j-1].done?'disabled':''}>${c.id}</button>`).join('')}</div><p class="ai-status">${CASES[i].id} · 열람 패널 ${d.opened.length}/7 · 의견 ${d.chat.length}건${d.locked?' · 복기 중':''}</p><div class="chatbox">${d.chat.map((m,j)=>`<div class="bubble"><strong>나</strong> · ${esc(m.stage)}<br>${esc(m.question)}</div><div class="bubble aianswer"><strong>${m.mode==='builtin'?'내장 동료':'AI 동료'}</strong><br>${esc(m.answer)}<label>검토 결과${select(`cases.${i}.chat.${j}.decision`,['','채택','수정 채택','기각'])}</label><label>자료와 대조한 이유${area(`cases.${i}.chat.${j}.reason`,'어떤 기록과 비교했는지 구체적으로 적으세요.')}</label><label>수정한 내용 (수정 채택 시 필수)${area(`cases.${i}.chat.${j}.modified`,'내 판단에 반영할 수정 의견')}</label></div>`).join('')||'<div class="inset help">아직 대화가 없습니다. 조회한 기록을 바탕으로 동료에게 질문해보세요.</div>'}</div><label>동료에게 질문${area(`cases.${i}.question`,'예: 이 기록으로 어디까지 판단할 수 있을까?')}</label>${S.mode==='builtin'?`<button class="small" data-act="builtin" ${d.builtinIndex>=3?'disabled':''}>내장 동료 의견 받기 (${Math.min(d.builtinIndex,3)}/3)</button><p class="help">사례별 준비 의견입니다. 입력 질문에 대한 생성형 답변은 아닙니다.</p>`:`<button class="small" data-act="packet">패킷 만들기 · 복사</button>${d.pendingPacket?`<details open><summary>전달할 패킷 / 복사 대체</summary><textarea id="packetText" readonly aria-label="AI 전달 패킷">${esc(d.pendingPacket)}</textarea><p class="help">LLM의 같은 대화에 붙여넣으세요. 복사가 안 되면 위 내용을 직접 선택해 복사하세요.</p></details><label>AI 답 붙여넣기${area(`cases.${i}.answer`,'LLM에서 받은 답변을 그대로 붙여넣으세요.')}</label><button class="small" data-act="answer">답변 기록하기</button>`:''}`}<p class="help spacer">AI 답변의 타당성은 직접 판단합니다. 점수 대신 사용 기록과 검토 근거가 보고서에 남습니다.</p></section>`;}
function aiCounts(){const a=S.cases.flatMap(c=>c.chat);return {all:a.length,accepted:a.filter(x=>x.decision==='채택').length,modified:a.filter(x=>x.decision==='수정 채택').length,rejected:a.filter(x=>x.decision==='기각').length,reviewed:a.filter(x=>x.decision&&x.reason.trim()&&(x.decision!=='수정 채택'||x.modified.trim())).length};}
function aiReady(){const a=S.cases.flatMap(c=>c.chat);return a.length>0&&a.every(x=>x.decision&&x.reason.trim()&&(x.decision!=='수정 채택'||x.modified.trim()));}
function morning(){const m=S.morning;return `<div class="summary"><div class="card call"><p class="eyebrow">06:00 / MORNING INVENTORY</p><h1>아침 재고 보고</h1><p class="muted">SKU × 로케이션별 수량 일치율을 검산하고, 내일 먼저 확인할 위치를 정하세요.</p></div><div class="card"><h2>조치 전 점검 자료</h2><p class="help">C1·C2의 각 현장 확인 직전 전산 기록과 해당 실사 결과를 묶은 표입니다. C3 피킹 이후 수량과 토트는 포함하지 않습니다. 아래 다섯 조합은 0개인 경우도 점검 대상으로 셉니다.</p>${simpleTable(['로케이션','SKU / 상품','전산 수량','실사 수량','일치 여부'],AUDIT.map(r=>[...r,r[2]===r[3]?'일치':'불일치']))}<div class="inset"><h3>C1 생수: 존재하는 수량과 출고 가능한 수량</h3>${simpleTable(['실물 위치','실물 존재 수량','출고 가능 수량'],[['B-07',96,96],['R-2 검수대',24,0],['합계',120,96]])}<p class="help">검수대 24개는 존재 수량에 포함되지만 검수 미완료로 출고할 수 없습니다. R-2는 위 일치율의 분모에는 포함하지 않습니다.</p></div><div class="grid2"><label>일치 건수 (분자)${input('morning.numerator','직접 입력','number',m.locked)}</label><label>점검 조합 수 (분모)${input('morning.denominator','직접 입력','number',m.locked)}</label></div>${m.locked?`<div class="notice">내 검산: ${esc(m.numerator)} / ${esc(m.denominator)} = ${(Number(m.numerator)/Number(m.denominator)*100).toFixed(1)}%<br>이는 입력한 분수의 계산값입니다. 정답 판정은 하지 않습니다.</div>`:'<button class="spacer" data-act="calc">검산 입력 확정 · 계산값 보기</button>'}</div><div class="card"><h2>내일 실사 우선순위</h2><p class="help">서로 다른 세 곳을 고르고, 각 위치의 특성과 오늘 확인한 위험을 연결해 이유를 남기세요. 선택에 정답 판정은 없습니다.</p>${m.priorities.map((p,i)=>`<div class="inset"><h3>우선순위 ${i+1}</h3><label>로케이션<select data-bind="morning.priorities.${i}.loc"><option value="">선택하세요</option>${LOCATIONS.map(([l,t])=>`<option value="${l}" ${p.loc===l?'selected':''}>${l} · ${t}</option>`).join('')}</select></label><label>이 위치를 먼저 확인할 이유${area(`morning.priorities.${i}.reason`,'특성과 예상되는 불일치를 연결해 적으세요.')}</label></div>`).join('')}<button class="primary" data-act="report">당직 보고서 만들기</button></div></div>`;}
function profile(){const n=aiCounts(),open=S.cases.reduce((a,c)=>a+c.opened.length,0);return `<h2>이번 당직의 행동 프로파일</h2><p class="muted">활동 기록입니다. 클릭 수·속도·AI 채택률을 역량 점수로 환산하지 않습니다.</p><div class="grid2"><div class="metric"><span>케이스별 열람 패널 합계</span><strong>${open}</strong><span>케이스별로 중복 제거 / 최대 28</span></div><div class="metric"><span>AI 교환 횟수</span><strong>${n.all}</strong><span>${n.all?`채택 ${n.accepted} · 수정 ${n.modified} · 기각 ${n.rejected}`:'AI 미사용 · 해당 없음'}</span></div></div><h3 class="spacer">교수자가 보고서에서 확인할 네 가지</h3><div class="reviewaxes">${[['01','상충하는 기록을 찾아 연결했는가','창고운영 · 재고관리'],['02','확인된 사실과 추정을 구분했는가','재고관리 · 입고관리'],['03','조치에 조건을 붙였는가','창고운영 · 입고관리'],['04','AI 의견을 자료와 대조했는가','물류 시스템 운영']].map(([n,t,j])=>`<div class="metric"><span>${n} / ${j}</span><strong>${t}</strong><span>${n==='04'&&!aiCounts().all?'해당 없음':'교수자 검토 항목 · 자동 평가 없음'}</span></div>`).join('')}</div>`;}
function reportScreen(){return `<div class="summary"><div class="card call"><p class="eyebrow">SHIFT COMPLETE / 06:00</p><h1>당직을 마무리합니다.</h1><p>판단과 복기, AI 협업 기록을 함께 제출하세요.</p></div><div class="card">${profile()}</div><div class="card"><h2>제출 파일 저장</h2><div class="flex"><button class="primary" data-act="print">보고서 인쇄 · PDF 저장</button><button data-act="txt">TXT 다운로드</button><button class="small" data-act="export">진행 JSON 저장</button></div><p class="help spacer">인쇄 창에서 대상 ‘PDF로 저장’을 선택하세요. 권장: A4, 배율 기본, 머리글·바닥글 해제. 파일명: ${esc(filename())}.pdf</p><label class="downloadcheck"><input type="checkbox" data-bind="exports.pdfConfirmed" ${S.exports.pdfConfirmed?'checked':''}>PDF 파일이 실제로 저장된 것을 확인했습니다.</label><p class="${S.exports.txt&&S.exports.pdfConfirmed?'ok':'muted'}">${S.exports.txt&&S.exports.pdfConfirmed?'제출 준비 완료 · PDF와 TXT를 수업 제출함에 올리세요.':`PDF 확인 ${S.exports.pdfConfirmed?'완료':'대기'} · TXT 다운로드 ${S.exports.txt?'완료':'대기'}`}</p><p class="help">브라우저는 PDF 저장 성공 여부를 자동으로 알 수 없어 직접 확인합니다. 다운로드 차단 시 브라우저의 다운로드 허용 상태를 확인하세요.</p><button class="small" data-act="backMorning">아침 보고 수정</button></div><details class="card" open><summary>보고서 미리보기</summary><div id="reportPreview" class="spacer">${reportHTML()}</div></details></div>`;}
function reportHTML(){const m=S.morning,n=aiCounts();return `<div class="printhead"><p>QFRESH / NIGHT SHIFT REPORT</p><h1>Q프레시 창고 운영실<br>WMS 첫 당직 보고서</h1><p>학번 ${esc(S.student.id)} · 이름 ${esc(S.student.name)}<br>작성일 ${new Date().toLocaleDateString('ko-KR')} · 5주차 개인 활동</p></div><section class="reportsection">${profile()}<p class="spacer">AI 모드 기록: ${[...new Set(S.cases.flatMap(c=>c.chat).map(m=>m.mode==='builtin'?'내장 모드':'외부 LLM'))].join(', ')||'AI 미사용 · 해당 없음'}</p></section>${CASES.map((c,i)=>{const d=S.cases[i];return `<section class="reportsection case-report"><h2>${c.id} · ${esc(c.title)}</h2><p class="muted">조회 기준 ${c.time}${c.archive?' / 과거 호출 재검토':''} · 최초 판단 ${d.locked?'확정':'미확정'}</p><h3>기록으로 확인한 사실</h3>${d.facts.map(f=>`<p>${esc(PANELS[f.panel][0])} · ${esc(f.column)} = ${esc(f.value)}<br><span class="muted">${esc(f.rowContext)}</span></p>`).join('')||'<p>없음</p>'}<h3>아직 확인되지 않은 점</h3><p>${esc(d.unknown)}<br>확인 대상: ${esc(d.where.join(', '))}<br>위치 판단: ${esc(d.location)} / 수량: ${esc(d.quantity)}</p><h3>WMS 오류 판단</h3><p>${esc(d.error)} · ${esc(d.errorFields.join(', '))}<br>${esc(d.errorNote)}</p><h3>지금 할 일</h3><p>${esc(d.now.join(', '))}<br>${esc(d.nowNote)}</p><h3>조건부 후속 조치</h3><p>조건: ${esc(d.condition)}<br>조치: ${esc(d.later.join(', '))}<br>${esc(d.laterNote)}</p>${d.locked?`<div class="inset"><h3>현장 확인 결과</h3><p>${esc(c.result)}</p></div>`:''}<h3>복기</h3><p>맞은 것: ${esc(d.right)}<br>놓친 것: ${esc(d.missed)}${i===2?`<br>호출자의 말 중 확인 없이 받아들인 것: ${esc(d.caller)}`:''}</p><p class="muted">열람 패널: ${d.opened.map(k=>PANELS[k][0]).join(', ')}</p></section>`;}).join('')}<section class="reportsection case-report"><h2>아침 재고 보고</h2><p>조치 전 / SKU × 로케이션별 수량 일치율</p>${simpleTable(['위치','SKU','전산','실사','일치'],AUDIT.map(r=>[...r,r[2]===r[3]?'일치':'불일치']))}<p>학생 검산: ${esc(m.numerator)} / ${esc(m.denominator)} = ${m.locked?(Number(m.numerator)/Number(m.denominator)*100).toFixed(1)+'%':'미확정'}</p><p>생수 실물 존재 수량: 120개 / 출고 가능 수량: 96개<br>R-2 검수 보류 24개는 출고 불가, 일치율 점검 대상에서는 제외.</p><h3>내일 실사 우선순위</h3>${m.priorities.map((p,i)=>`<p>${i+1}. ${esc(p.loc)} — ${esc(p.reason)}</p>`).join('')}</section><section class="reportsection case-report"><h2>AI 동료 협업 기록</h2><p>${n.all?`교환 ${n.all}회 · 채택 ${n.accepted} · 수정 채택 ${n.modified} · 기각 ${n.rejected}`:'AI 미사용 · 해당 없음'}</p>${S.cases.map((c,i)=>c.chat.map((m,j)=>`<div class="reportsection"><h3>${CASES[i].id} · 대화 ${j+1} / ${m.mode==='builtin'?'내장 모드':'외부 LLM'} / ${esc(m.stage)}</h3><p><strong>질문</strong><br>${esc(m.question)}</p><p><strong>AI 답변</strong><br>${esc(m.answer)}</p><p><strong>검토: ${esc(m.decision||'미검토')}</strong><br>근거: ${esc(m.reason)}<br>수정 내용: ${esc(m.modified||'해당 없음')}</p></div>`).join('')).join('')}</section>`;}
function filename(){return `창고당직보고서_${S.student.id}_${S.student.name}`.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_');}
function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function openPanel(k){const d=S.cases[S.current];d.panel=k;if(!d.opened.includes(k)){d.opened.push(k);log(`${CASES[S.current].id} · ${PANELS[k][0]} 열람`);}render();}
function guideNext(){const d=S.cases[0],k=['inv','pick','io'].find(x=>!d.opened.includes(x));if(k)guideTimer=setTimeout(()=>{if(S.phase!==1||S.current!==0||S.cases[0].locked)return;if(document.activeElement?.matches('input,textarea,select')){guideNext();return;}openPanel(k);},d.opened.length?4500:500);}
function buildPacket(i){const d=S.cases[i],c=CASES[i],first=d.packetHistory.length===0,newKeys=d.opened.filter(k=>!d.sentPanels.includes(k));let text=first?'너는 Q프레시 창고운영팀에서 나와 함께 야간 당직을 서는 AI다. WMS의 일반 구조는 알지만, 오늘 밤 데이터는 내가 보여주는 것만 안다. 동료처럼 편하게 의견을 말해줘.\n\n':'';if(first||S.lastPacketCase!==i)text+=`${S.lastPacketCase!==undefined&&S.lastPacketCase!==i?'이제 다른 호출이다: ':''}${c.id} / 조회 기준 ${c.time}\n호출: ${c.title}\n\n`;text+=(newKeys.length?newKeys.map(k=>`${PANELS[k][0]} / 조회 기준 ${c.time}\n${COLS[k].join(' | ')}\n${c.data[k].map(r=>r.join(' | ')).join('\n')}`).join('\n\n'):'새로 열어본 패널 없음')+`\n\n질문: ${d.question.trim()}`;return{text,newKeys};}
function validCase(i){const d=S.cases[i];return d.facts.length&&d.unknown.trim()&&d.where.length&&d.quantity.trim()&&d.errorNote.trim()&&d.now.length&&d.nowNote.trim()&&d.condition.trim()&&d.later.length&&d.laterNote.trim()&&(d.error!=='오류 의심'||d.errorFields.some(x=>x!=='해당 없음'));}
const ACT={
message(b){const i=Number(b.dataset.i),fresh=!S.read.includes(i);if(fresh)S.read.push(i);render();if(fresh&&!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){const p=document.querySelector(`[data-act="message"][data-i="${i}"] p`);let n=0;p.textContent='';const typing=setInterval(()=>{p.textContent=MSGS[i].slice(0,++n);if(n>=MSGS[i].length)clearInterval(typing);},16);}},introPanel(){S.introPanel=true;render();},
start(){if(!S.student.id.trim()||!S.student.name.trim())return toast('학번과 이름을 입력하세요.');if(S.read.length!==3||!S.introPanel)return;S.phase=1;log('23:00 인수인계 완료 · 당직 시작');render();},
panel(b){openPanel(b.dataset.key);},case(b){const i=Number(b.dataset.i);if(i&& !S.cases[i-1].done)return;S.current=i;activeAi=i;render();},aiTab(b){activeAi=Number(b.dataset.i);render();},
fact(b){const i=S.current,d=S.cases[i];if(d.locked)return;const k=b.dataset.key,r=Number(b.dataset.row),col=Number(b.dataset.col),key=`${k}:${r}:${col}`;if(d.facts.some(f=>f.key===key))d.facts=d.facts.filter(f=>f.key!==key);else d.facts.push({key,panel:k,column:COLS[k][col],value:String(CASES[i].data[k][r][col]),rowContext:CASES[i].data[k][r].join(' / ')});$('#facts').innerHTML=factsHTML(i);$('#panelarea').innerHTML=panelHTML(i);},removeFact(b){if(S.cases[S.current].locked)return;S.cases[S.current].facts.splice(Number(b.dataset.i),1);$('#facts').innerHTML=factsHTML(S.current);$('#panelarea').innerHTML=panelHTML(S.current);},
confirm(){const d=S.cases[S.current];if(d.locked)return;if(!validCase(S.current))return toast('근거, 미확인 사항, 확인 대상, 오류 판단 근거, 지금 조치와 조건부 조치를 모두 작성하세요.');d.locked=true;d.revealed=true;d.openedBefore=d.opened.slice();log(`${CASES[S.current].id} 판단 확정 · 현장 결과 확인`);render();$('.result')?.scrollIntoView({behavior:'smooth',block:'center'});},
finishCase(){const i=S.current,d=S.cases[i];if(!d.locked)return;if(!d.right.trim()||!d.missed.trim()||(i===2&&!d.caller.trim()))return toast('복기의 모든 칸을 작성하세요.');if(!d.done){d.done=true;log(`${CASES[i].id} 복기 완료`);}if(i<3){S.current=i+1;activeAi=i+1;}else{if(!S.cases.every(x=>x.done))return toast('모든 호출의 복기를 완료하세요.');if(!aiReady())return toast('AI 대화가 1회 이상 필요합니다. 기록한 모든 답변에 검토 결과·이유를 남기고, 수정 채택에는 수정 내용을 적으세요.');S.phase=2;log('아침 재고 보고 시작');}render();window.scrollTo(0,0);},
async packet(){const i=activeAi,d=S.cases[i];if(!d.question.trim())return toast('먼저 질문을 입력하세요.');if(d.pendingPacket)return toast('현재 패킷의 답변을 먼저 기록하세요. 같은 패킷은 아래 칸에서 다시 복사할 수 있습니다.');const p=buildPacket(i);d.pendingPacket=p.text;d.pendingQuestion=d.question.trim();d.pendingKeys=p.newKeys;d.pendingStage=d.locked?'현장 확인 후':'판정 확정 전';render();try{await navigator.clipboard.writeText(p.text);toast('패킷을 복사했습니다. LLM의 같은 대화에 붙여넣으세요.');}catch{toast('패킷 칸의 내용을 직접 선택해 복사하세요.');$('#packetText')?.select();}},
answer(){const d=S.cases[activeAi];if(!d.pendingPacket||!d.answer.trim())return toast('패킷을 만들고 AI 답변을 붙여넣으세요.');d.chat.push({question:d.pendingQuestion,answer:d.answer.trim(),mode:'external',stage:d.pendingStage,decision:'',reason:'',modified:'',packet:d.pendingPacket});d.packetHistory.push(d.pendingPacket);S.lastPacketCase=activeAi;d.sentPanels=[...new Set([...d.sentPanels,...d.pendingKeys])];d.pendingPacket='';d.pendingKeys=[];d.answer='';d.question='';log(`${CASES[activeAi].id} AI 답변 기록`);render();},
builtin(){const d=S.cases[activeAi];if(!d.question.trim())return toast('먼저 질문을 입력하세요.');if(d.builtinIndex>=3)return;if(!d.opened.length)return toast('사례의 패널을 하나 이상 열고 의견을 요청하세요.');d.chat.push({question:d.question.trim(),answer:CASES[activeAi].builtin[d.builtinIndex++],mode:'builtin',stage:d.locked?'현장 확인 후':'판정 확정 전',decision:'',reason:'',modified:'',packet:''});d.question='';log(`${CASES[activeAi].id} 내장 동료 의견 기록`);render();},
calc(){const m=S.morning;if(m.locked)return;const n=Number(m.numerator),d=Number(m.denominator);if(m.numerator===''||m.denominator===''||!Number.isInteger(n)||!Number.isInteger(d)||n<0||d<=0||n>d)return toast('0 이상의 정수 분자와 1 이상의 정수 분모를 입력하세요. 분자는 분모 이하여야 합니다.');m.locked=true;log('재고 검산 입력 확정');render();},
report(){const m=S.morning;if(!m.locked)return toast('재고 검산 입력을 먼저 확정하세요.');if(m.priorities.some(p=>!p.loc||!p.reason.trim())||new Set(m.priorities.map(p=>p.loc)).size!==3)return toast('서로 다른 로케이션 세 곳과 이유를 입력하세요.');S.phase=3;log('당직 보고서 생성');render();window.scrollTo(0,0);},backMorning(){S.phase=2;render();},
print(){if(S.phase!==3)return;S.exports.print=true;$('#printReport').innerHTML=reportHTML();const old=document.title;document.title=filename();window.print();document.title=old;render();},
txt(){if(S.phase!==3)return;S.exports.txt=true;log('TXT 보고서 다운로드 요청');const el=document.createElement('div');el.innerHTML=reportHTML();const text=el.innerHTML.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|h[1-6]|section|tr|div)>/gi,'\n').replace(/<\/(td|th)>/gi,' | ');el.innerHTML=text;download(filename()+'.txt','\ufeff'+el.textContent+'\n\n[사건 로그]\n'+JSON.stringify(S.logs,null,2)+'\n\n[열람 기록 JSON]\n'+JSON.stringify(S.cases.map((c,i)=>({case:CASES[i].id,opened:c.opened,openedBeforeDecision:c.openedBefore||[]})),null,2)+'\n\n[AI 전달 패킷 기록]\n'+JSON.stringify(S.cases.map((c,i)=>({case:CASES[i].id,packets:c.packetHistory})),null,2),'text/plain;charset=utf-8');render();},
export(){download(filename()+'.json',JSON.stringify(S,null,2),'application/json;charset=utf-8');toast('진행 파일을 저장했습니다. 불러오기로 이어서 진행할 수 있습니다.');},import(){$('#importFile').click();}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)ACT[b.dataset.act]?.(b);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bind){set(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);if(t.dataset.bind.startsWith('morning.'))S.exports={txt:false,print:false,pdfConfirmed:false};if(t.dataset.bind==='exports.pdfConfirmed')render();}if(t.dataset.array){const a=val(t.dataset.array);set(t.dataset.array,t.checked?[...new Set([...a,t.value])]:a.filter(x=>x!==t.value));}});
document.addEventListener('change',e=>{if(e.target.dataset.bind==='mode')render();});
function validateState(x){if(!x||x.version!==VERSION||![0,1,2,3].includes(x.phase)||!Number.isInteger(x.current)||x.current<0||x.current>3)throw Error('이 활동의 진행 파일이 아닙니다.');if(!x.student||typeof x.student.id!=='string'||typeof x.student.name!=='string'||!['external','builtin'].includes(x.mode))throw Error('당직자 정보가 올바르지 않습니다.');if(!Array.isArray(x.cases)||x.cases.length!==4||!Array.isArray(x.logs)||!Array.isArray(x.read)||x.read.some(n=>![0,1,2].includes(n))||new Set(x.read).size!==x.read.length)throw Error('진행 기록 형식이 올바르지 않습니다.');x.cases.forEach((c,i)=>{for(const k of ['opened','facts','where','errorFields','now','later','chat','sentPanels','packetHistory'])if(!Array.isArray(c[k]))throw Error('사례 기록이 손상됐습니다.');for(const k of ['unknown','location','quantity','error','errorNote','nowNote','condition','laterNote','right','missed','caller','question','answer','pendingPacket'])if(typeof c[k]!=='string')throw Error('사례 문장 형식이 올바르지 않습니다.');if(c.opened.some(k=>!PANELS[k])||(c.panel&&!PANELS[c.panel])||c.sentPanels.some(k=>!PANELS[k]))throw Error('패널 정보가 올바르지 않습니다.');if(c.facts.some(f=>!PANELS[f.panel]||typeof f.column!=='string'||typeof f.value!=='string'||typeof f.rowContext!=='string'))throw Error('근거 정보가 올바르지 않습니다.');if(c.chat.some(m=>['question','answer','stage','decision','reason','modified'].some(k=>typeof m[k]!=='string')||!['external','builtin'].includes(m.mode)))throw Error('AI 대화 형식이 올바르지 않습니다.');if(typeof c.locked!=='boolean'||typeof c.done!=='boolean'||(c.done&&!c.locked)||!Number.isInteger(c.builtinIndex)||c.builtinIndex<0||c.builtinIndex>3)throw Error('사례 단계가 올바르지 않습니다.');if(i&&c.opened.length&&!x.cases[i-1].done)throw Error('호출 순서가 올바르지 않습니다.');if(c.pendingPacket&&(!Array.isArray(c.pendingKeys)||typeof c.pendingQuestion!=='string'||typeof c.pendingStage!=='string'))throw Error('진행 중 패킷이 손상됐습니다.');});if(!x.morning||!Array.isArray(x.morning.priorities)||x.morning.priorities.length!==3||x.morning.priorities.some(p=>typeof p.loc!=='string'||typeof p.reason!=='string')||!x.exports)throw Error('아침 보고 형식이 올바르지 않습니다.');if(x.current&&!x.cases[x.current-1].done)throw Error('호출 순서가 올바르지 않습니다.');if(x.phase>=2&&!x.cases.every(c=>c.done))throw Error('완료되지 않은 사례가 있습니다.');if(x.phase===3&&!x.morning.locked)throw Error('검산이 완료되지 않았습니다.');return x;}
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('진행 파일은 5MB 이하여야 합니다.');const x=validateState(JSON.parse(await file.text()));if(!confirm('현재 화면의 진행을 불러온 파일로 바꿉니다. 필요한 경우 취소한 뒤 먼저 진행을 저장하세요.'))return;S=x;activeAi=S.current;timerCase=-1;log('진행 파일 불러오기');render();toast('저장한 지점에서 이어서 진행합니다.');}catch(err){toast('불러오지 못했습니다: '+err.message);}finally{e.target.value='';}});
setInterval(()=>{const el=$('#timer');if(!el||S.phase!==1)return;const sec=Math.max(0,CASES[S.current].minutes*60-Math.floor((Date.now()-elapsedStart)/1000));el.textContent=S.cases[S.current].done?'복기 완료':sec?`권장 시간 ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`:'권장 시간 경과 · 계속 진행 가능';},1000);
window.addEventListener('beforeunload',e=>{if(S.phase>0&&!(S.exports.txt&&S.exports.pdfConfirmed)){e.preventDefault();e.returnValue='';}});
render();
</script></body></html>
