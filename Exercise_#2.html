<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객 미팅 30분 전 · 미팅 준비 보고서</title><style>
:root{--navy:#1B3A6B;--blue:#2D5FA8}*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#172c46;font:16px/1.7 system-ui,'Malgun Gothic',sans-serif}header{position:sticky;top:0;background:white;border-bottom:1px solid #d9e2ef;z-index:2;padding:12px max(18px,calc((100% - 716px)/2));display:flex;justify-content:space-between;gap:12px;align-items:center}header small{font-size:11px}#clock{white-space:nowrap;font-weight:750;color:var(--navy);font-variant-numeric:tabular-nums}main{max-width:760px;padding:28px 22px 45px;margin:auto;background:white;min-height:88vh}h1{font-size:30px;line-height:1.35;letter-spacing:-1px;color:var(--navy)}h2{font-size:21px}h3{font-size:17px;margin-top:0}.eyebrow{font-size:12px;color:var(--blue);font-weight:700}.hint{font-size:14px;color:#56677e}.notice{background:#f2f6fc;border-left:3px solid var(--blue);padding:12px 15px;font-size:14px}.card,.paper{border:1px solid #d9e2ef;padding:18px;border-radius:10px;margin:16px 0}.paper{border-radius:0;border-top:4px solid var(--navy)}button,input,textarea,select{font:inherit}button{min-height:48px;padding:10px 13px;background:white;border:1px solid #bccbdd;border-radius:8px;color:var(--navy);cursor:pointer}button.primary{background:var(--navy);color:white;border-color:var(--navy)}button[aria-pressed=true]{background:#e7effb;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #78a5e5;outline-offset:3px}.choices,.nav{display:flex;gap:8px}.choices button{flex:1;padding:9px 4px;font-size:13px}.nav{border-top:1px solid #d9e2ef;padding-top:20px;margin-top:26px;flex-wrap:wrap}.nav .primary{flex:1}label{display:block;margin:18px 0;font-size:15px;font-weight:600}input,textarea,select{display:block;width:100%;padding:11px;border:1px solid #b8c7da;border-radius:7px;background:white;color:#172c46;margin-top:7px;font-weight:400}textarea{min-height:100px;resize:vertical}textarea.prompt{min-height:290px;font-size:14px}details{margin:18px 0}summary{color:var(--blue);cursor:pointer;padding:8px 0}.sentence{display:block;width:100%;text-align:left;border:0;padding:12px 4px;margin:5px 0;line-height:1.8}.sentence[aria-pressed=true]{text-decoration:underline;text-decoration-color:var(--blue);text-underline-offset:5px;box-shadow:none}.num{font-size:11px;color:#56677e;margin-right:8px}.bubble{background:#eef3fa;border-radius:0 14px 14px 14px;padding:16px;margin:16px 16px 16px 0}.attachment{display:block;width:100%;text-align:left}.status{font-size:14px;color:var(--blue);min-height:24px}.counter{display:block;text-align:right;font-size:12px;font-weight:400;color:#56677e}.report{overflow-wrap:anywhere}.report p{white-space:pre-wrap}.report h2{font-size:18px;margin:22px 0 8px}.report h3{font-size:14px;margin:12px 0 4px}.report .identity{font-size:13px;padding:12px 0;border-bottom:1px solid #d9e2ef}.report .answer{margin:4px 0 12px}.report footer{border-top:1px solid #d9e2ef;margin-top:22px;padding-top:10px;font-size:11px;color:#56677e}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row label{margin:8px 0}.hero{padding:35px 0}.report-title{font-size:26px}.report section{break-inside:avoid}.report .sub{font-size:12px;color:#56677e}@page{size:A4;margin:14mm}@media print{body{background:white;font:10pt/1.5 'Malgun Gothic',sans-serif}header,.noprint,main>h1,main>.eyebrow{display:none!important}main{padding:0;max-width:none;min-height:0}.report{border:0;padding:0;margin:0}.report-title{font-size:20pt;margin:0 0 8pt}.report h2{font-size:12pt;margin:12pt 0 5pt}.report h3{font-size:10pt;margin:7pt 0 3pt}.report .identity{font-size:9pt;padding:7pt 0}.report .answer{margin:3pt 0 7pt}.report footer{font-size:8pt;margin-top:12pt;padding-top:6pt}.report .sub{font-size:8pt}}@media(max-width:430px){main{padding:23px 18px 35px}.paper{padding:14px}.choices{gap:5px}.choices button{font-size:12px}.row{grid-template-columns:1fr}header{padding:11px 18px}}
</style></head><body><header><small>SEON LOGISTICS / 사내 메신저</small><span id="clock">30:00</span></header><main id="app"></main><script>
'use strict';
const terms=['스마트물류','물류 4.0','자동화','무인화','풀필먼트','라스트마일','물류 가시성','사물인터넷(IoT)'];
const memo=['한결리테일은 생활용품을 판매하는 중견 유통기업으로, 온라인 주문 증가에 맞춰 스마트물류 도입을 논의하고자 합니다.','물류 4.0 관점에서 주문·재고·배송 정보를 연결해 현장 의사결정에 활용하고 싶습니다.','이번 창고 자동화는 무인화와 같은 뜻이므로, 도입이 끝나면 현장에 사람이 전혀 필요 없다고 보고 인력계획을 세우려 합니다.','풀필먼트는 택배 배송만 대신해 주는 서비스로 알고 있어, 상품 보관과 주문별 포장은 논의 범위에서 제외하려 합니다.','라스트마일에서는 지역 배송 거점에서 고객에게 전달되는 마지막 구간의 지연을 줄이고 싶습니다.','물류 가시성을 높여 주문한 상품이 어느 단계에 있는지 고객응대 담당자가 확인할 수 있으면 좋겠습니다.','사물인터넷(IoT) 센서를 활용해 보관 공간의 온도 기록을 모으는 방안도 상담받고 싶습니다.','우선 운반 로봇 몇 대만 들이면 스마트물류가 완성되어 재고 불일치와 배송 지연도 모두 해결될 것으로 기대합니다.'];
const checks=['AI가 자동화와 무인화를 구분했는가?','AI가 풀필먼트를 배송과 구분했는가?','AI 설명에 기술 하나로 모든 문제가 풀린다는 식의 과장이 있는가?','AI가 확인되지 않은 고객사 상황이나 효과를 단정했는가?','내가 밑줄 친 문장을 AI도 검토가 필요하다고 짚었는가?','AI가 확실하지 않은 점이나 추가로 확인할 조건을 밝혔는가?'];
const prompt=['나는 물류 컨설팅사 신입이고 고객 미팅을 준비하고 있어.','아래는 가상 고객사 한결리테일의 안건 메모야.','[안건 메모] '+memo.join(' '),'메모에 나오는 스마트물류, 물류 4.0, 자동화, 무인화, 풀필먼트, 라스트마일, 물류 가시성, 사물인터넷(IoT)을 각각 쉬운 말로 설명해줘.','설명에는 이 고객사의 업무에 연결되는 예를 짧게 붙여줘.','메모에 대한 네 의견과 미팅 전에 확인할 내용을 알려줘.','확실하지 않은 것은 확실하지 않다고 말해줘.'].join('\n');
const state={step:0,started:0,msg:0,diag:Array(8).fill(''),marked:[],ai:'',source:'',verdict:Array(6).fill(''),evidence:Array(6).fill(''),r:{name:'',id:'',date:new Date().toLocaleDateString('sv-SE'),term1:'',reason1:'',term2:'',reason2:'',quote:'',judgment:'',opinion:'',question:''},picked:''};
const fields=[['term1','첫 번째 용어',24],['reason1','혼동한 것으로 보는 이유',100],['term2','두 번째 용어',24],['reason2','혼동한 것으로 보는 이유',100],['quote','검토할 AI 문장 1개',160],['judgment','그 문장에 대한 내 판단과 근거',160],['opinion','고객에게 설명할 내용 · 내 말로 2~3문장',240],['question','추가로 확인할 정보 또는 고객에게 물어볼 질문 1개',120]];
const app=document.getElementById('app');let messageTimer;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function doc(select=false){return '<div class="paper"><small>한결리테일 · 운영기획팀 / 가상 업무 문서</small><h2>스마트물류 도입 미팅 안건</h2>'+memo.map((s,i)=>select?`<button class="sentence" data-mark="${i}" aria-pressed="${state.marked.includes(i)}"><span class="num">${i+1}</span>${esc(s)}</button>`:`<p><span class="num">${i+1}</span>${esc(s)}</p>`).join('')+'</div>';}
const nav=(text='다음 단계')=>`<div class="nav"><button data-back>이전</button><button class="primary" data-next>${text}</button></div>`;
const choices=(items,val,attr)=>'<div class="choices">'+items.map(x=>`<button ${attr} data-value="${esc(x)}" aria-pressed="${x===val}">${esc(x)}</button>`).join('')+'</div>';
function rfield(f){const[k,label,max]=f;return `<label>${label}<textarea data-report="${k}" maxlength="${max}" ${max<30?'style="min-height:60px"':''}>${esc(state.r[k])}</textarea><span class="counter" id="count-${k}">${state.r[k].length} / ${max}자</span></label>`;}
function report(){const r=state.r;return `<article id="report" class="report paper"><div class="eyebrow">스마트물류의 이해 · 2주차 개인 실습</div><h1 class="report-title">고객 미팅 준비 보고서</h1><div class="sub">수신: 정서윤 선임 컨설턴트 / 고객사: 한결리테일(가상)</div><div class="identity">작성자: ${esc(r.name||'미기재')}　 학번: ${esc(r.id||'미기재')}　 작성일: ${esc(r.date||'미기재')}</div><section><h2>1. 고객 안건 검토</h2><h3>${esc(r.term1)}</h3><p class="answer">${esc(r.reason1)}</p><h3>${esc(r.term2)}</h3><p class="answer">${esc(r.reason2)}</p></section><section><h2>2. AI 답변 검증</h2><div class="sub">사용한 답변: ${esc(state.source)}</div><h3>검토한 AI 문장</h3><p class="answer">${esc(r.quote)}</p><h3>내 판단과 근거</h3><p class="answer">${esc(r.judgment)}</p></section><section><h2>3. 미팅 준비 의견</h2><p class="answer">${esc(r.opinion)}</p></section><section><h2>4. 추가 확인 사항</h2><p class="answer">${esc(r.question)}</p></section><footer>개인 활동 · 무점수 / 이 보고서는 학생의 판단 기록입니다.</footer></article>`;}
function render(){clearTimeout(messageTimer);const n=state.step;const titles=['','선배의 업무 요청','고객 안건 메모','먼저, 나의 판단','AI에게 설명 요청','AI 답변 검증','미팅 준비 보고서 작성','제출 보고서 미리보기'];app.innerHTML=n?`<div class="eyebrow">${String(n).padStart(2,'0')} / 07 · 개인 활동</div><h1 tabindex="-1">${titles[n]}</h1>`:'';
if(!n)app.innerHTML='<div class="eyebrow">스마트물류의 이해 · 2주차</div><div class="hero"><small>신입 컨설턴트의 첫 업무</small><h1>고객 미팅<br>30분 전</h1><p class="hint">메모를 읽고 AI의 설명을 검토한 뒤,<br>미팅 준비 보고서를 작성하세요.</p></div><p>개인 활동 25분 · 무점수 · 발표 없음</p><div class="notice">상황 속 시계는 30분입니다. 시간이 끝나도 작성할 수 있습니다. 마지막에 A4 1쪽 보고서를 PDF로 저장해 교수자가 지정한 곳에 제출합니다.</div><p class="hint">로그인 없이 이용합니다. 입력은 현재 페이지에서만 유지됩니다. 새로고침하거나 탭을 닫으면 사라지므로 AI 이용 중에도 이 탭을 열어 두세요.</p><button class="primary" style="width:100%" data-start>출근</button>';
if(n===1){app.innerHTML+='<p class="hint">프로젝트 채널 / 한결리테일 고객 미팅</p><div id="messages" aria-live="polite"></div>';showMessages();}
if(n===2)app.innerHTML+='<p class="hint">고객의 원문을 먼저 읽어보세요.</p>'+doc()+nav('읽었습니다 · 셀프 진단');
if(n===3)app.innerHTML+='<p class="hint">AI를 열기 전에 지금의 익숙함을 기록하세요.</p>'+terms.map((t,i)=>`<div class="card"><h3>${t}</h3>${choices(['설명할 수 있다','들어봤다','처음 본다'],state.diag[i],`data-diag="${i}"`)}</div>`).join('')+'<h2>검토하고 싶은 문장</h2><p class="hint">탭하면 밑줄, 다시 탭하면 해제됩니다. 최대 3개이며 선택하지 않아도 됩니다. 정오 피드백은 없습니다.</p>'+doc(true)+`<p id="markstatus" class="status" role="status">선택 ${state.marked.length} / 3</p>`+nav('내 판단을 기록하고 AI로');
if(n===4)app.innerHTML+='<p class="hint">프롬프트를 본인의 AI 앱에 붙여넣고, 답변을 받은 뒤 이 탭으로 돌아오세요.</p><textarea id="prompt" class="prompt" readonly aria-label="AI 프롬프트">'+esc(prompt)+'</textarea><button data-copy="prompt">프롬프트 복사</button><p id="copystatus" class="status" role="status"></p><div class="notice">AI를 사용할 수 없으면 교수자가 배포하는 예시 답변으로 진행하세요.</div><label>사용한 답변<select id="source"><option value="">선택하세요</option><option>내 AI 답변</option><option>교수자 배포 예시</option></select></label><label>AI 답변 원문<textarea id="ai" placeholder="답변 전체를 붙여넣으세요.">'+esc(state.ai)+'</textarea></label><p class="hint">예시를 화면으로만 보는 경우, 다음 단계에 근거 문장을 직접 적어도 됩니다. 답변 전문은 제출 보고서에 포함하지 않습니다.</p>'+nav('답변 검증하기');
if(n===5)app.innerHTML+='<p class="hint">O는 그렇다, X는 아니다입니다. O가 항상 좋은 답변이라는 뜻은 아닙니다. 언급이 없거나 판단하기 어려우면 그 이유를 적으세요.</p><details><summary>고객 메모</summary>'+doc()+'</details><details open><summary>내가 가져온 AI 답변</summary><p style="white-space:pre-wrap">'+esc(state.ai||'교수자 배포 예시를 보며 작성하세요.')+'</p></details>'+checks.map((q,i)=>`<div class="card"><h3>${i+1}. ${q}</h3>${choices(['O','X'],state.verdict[i],`data-verdict="${i}"`)}<label>근거 문장 한 줄<textarea data-evidence="${i}" placeholder="AI 문장과 판단 이유를 적으세요. 해당 내용이 없으면 ‘언급 없음’이라고 적으세요.">${esc(state.evidence[i])}</textarea></label></div>`).join('')+nav('보고서 작성하기');
if(n===6)app.innerHTML+='<p class="hint">활동에서 남긴 근거를 가져와 다듬고, 고객에게 할 말을 직접 작성하세요. A4 1쪽 분량을 위해 입력 길이를 제한했습니다.</p><div class="row"><label>이름 · 선택<input data-report="name" maxlength="25" value="'+esc(state.r.name)+'"></label><label>학번 · 선택<input data-report="id" maxlength="25" value="'+esc(state.r.id)+'"></label></div><label>작성일<input type="date" data-report="date" value="'+esc(state.r.date)+'"></label><p class="hint">이름·학번 기재 여부는 교수자의 제출 안내를 따르세요. 입력값은 이 페이지에서만 사용합니다.</p><details><summary>내가 밑줄 친 고객 문장</summary>'+(state.marked.map(i=>'<p>'+esc(memo[i])+'</p>').join('')||'<p>선택 없음</p>')+'</details><h2>1. 고객 안건 검토</h2><p class="hint">용어 2개와 이유를 적으세요. 판단이 어렵다면 그 이유를 남겨도 됩니다.</p>'+fields.slice(0,4).map(rfield).join('')+'<h2>2. AI 답변 검증</h2><p class="hint">받아들이기 어려운 문장과 근거를 적으세요. 문제를 찾지 못했다면 타당하다고 판단한 문장과 이유를 적어도 됩니다.</p><label>앞 단계의 근거 가져오기<select id="pick"><option value="">검증 항목 선택</option>'+checks.map((q,i)=>`<option value="${i}">${i+1}. ${esc(q)}</option>`).join('')+'</select></label><p id="candidate" class="notice" style="white-space:pre-wrap">항목을 선택하면 내가 쓴 근거가 여기에 표시됩니다.</p><button data-import>선택한 근거를 판단 칸에 가져오기</button><p class="hint">가져온 뒤 AI 인용문과 자신의 판단을 구분해 다듬으세요. 기존 판단 내용이 있으면 교체 전에 확인합니다.</p>'+fields.slice(4,6).map(rfield).join('')+'<h2>3. 미팅 준비 의견</h2>'+rfield(fields[6])+'<h2>4. 추가 확인 사항</h2>'+rfield(fields[7])+nav('보고서 미리보기');
if(n===7)app.innerHTML+='<div class="noprint"><p class="notice">아래는 제출할 보고서입니다. PDF 저장 버튼에서 인쇄 대상을 ‘PDF로 저장’으로 선택하세요. 저장만으로 제출되지는 않습니다.</p><p class="hint">용지 A4 · 배율 100% · 머리글/바닥글 끄기 권장. 기기의 인쇄 미리보기에서 1쪽인지 확인하세요. 저장 후 교수자가 지정한 LMS 등에 직접 제출합니다.</p></div>'+report()+'<div class="nav noprint"><button data-back>보고서 수정</button><button class="primary" data-print>PDF 저장 / 인쇄</button><button data-copy="report">보고서 복사</button></div><p id="copystatus" class="status noprint" role="status"></p><p class="hint noprint">메모는 완성됐다. 판단은 미팅에서 증명된다.</p>';
if(n===4)document.getElementById('source').value=state.source;}
const messages=['한결리테일 고객 미팅이 30분 뒤야. 오늘은 신입 컨설턴트로 배석해 줘.','고객 앞에서 아는 척은 한 번만 틀려도 끝이다. 모르는 것은 확인이 필요하다고 말해도 괜찮아.','안건을 읽고 네 판단을 남겨. AI의 설명도 검토한 뒤, 고객에게 할 말을 한 쪽짜리 미팅 준비 보고서로 정리해 줘.'];
function showMessages(){const el=document.getElementById('messages');if(!el)return;el.innerHTML='<small>정서윤 선임 컨설턴트</small>'+messages.slice(0,state.msg).map(m=>'<div class="bubble">'+m+'</div>').join('')+(state.msg<4?'<p class="hint">입력 중 · · ·</p>':'<button class="attachment" data-open>첨부 · 한결리테일 고객 안건 메모</button>');if(state.msg<4)messageTimer=setTimeout(()=>{state.msg++;showMessages();},850);}
function go(n){state.step=n;render();window.scrollTo(0,0);app.querySelector('h1')?.focus({preventScroll:true});}
function validate(){let msg='';if(state.step===3&&state.diag.some(x=>!x))msg='용어 8개의 익숙함을 선택해 주세요.';if(state.step===4&&(!state.source||(!state.ai.trim()&&state.source==='내 AI 답변')))msg='사용한 답변을 선택하고 AI 답변을 붙여넣어 주세요.';if(state.step===5&&(state.verdict.some(x=>!x)||state.evidence.some(x=>!x.trim())))msg='각 문항의 O/X와 근거를 남겨 주세요. 판단이 어렵다면 그 이유를 적어도 됩니다.';if(state.step===6&&fields.some(([k])=>!state.r[k].trim()))msg='보고서의 각 항목에 판단을 남겨 주세요. 확신하기 어렵다면 그 이유를 적어도 됩니다.';if(msg){alert(msg);return false;}return true;}
app.addEventListener('input',e=>{const t=e.target;if(t.id==='ai')state.ai=t.value;if(t.id==='source')state.source=t.value;if(t.hasAttribute('data-evidence'))state.evidence[+t.dataset.evidence]=t.value;if(t.hasAttribute('data-report')){state.r[t.dataset.report]=t.value;const el=document.getElementById('count-'+t.dataset.report);if(el)el.textContent=t.value.length+' / '+t.maxLength+'자';}});
app.addEventListener('change',e=>{if(e.target.id==='pick'){state.picked=e.target.value;document.getElementById('candidate').textContent=state.picked===''?'항목을 선택하세요.':state.evidence[+state.picked];}});
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-start')){if(!state.started)state.started=Date.now();go(1);}if(b.hasAttribute('data-open'))go(2);if(b.hasAttribute('data-next')&&validate())go(state.step+1);if(b.hasAttribute('data-back'))go(Math.max(1,state.step-1));for(const key of ['diag','verdict'])if(b.hasAttribute('data-'+key)){state[key][+b.dataset[key]]=b.dataset.value;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}if(b.hasAttribute('data-mark')){const i=+b.dataset.mark,at=state.marked.indexOf(i);if(at>=0)state.marked.splice(at,1);else if(state.marked.length<3)state.marked.push(i);else{document.getElementById('markstatus').textContent='최대 3개입니다. 기존 선택을 해제해 주세요.';return;}b.setAttribute('aria-pressed',String(state.marked.includes(i)));document.getElementById('markstatus').textContent='선택 '+state.marked.length+' / 3';}if(b.hasAttribute('data-import')){if(state.picked===''){alert('가져올 항목을 선택해 주세요.');return;}const value=state.evidence[+state.picked];if(value.length>160){alert('선택한 근거가 160자를 넘습니다. 위에 표시된 내용을 참고해 판단 칸에 짧게 정리해 주세요.');return;}if(state.r.judgment&&!confirm('현재 판단 내용을 선택한 근거로 교체할까요?'))return;state.r.judgment=value;const t=app.querySelector('[data-report="judgment"]');t.value=value;document.getElementById('count-judgment').textContent=value.length+' / 160자';t.focus();}if(b.hasAttribute('data-copy')){const t=document.getElementById(b.dataset.copy),content=t.value??t.innerText;let ok=false;try{await navigator.clipboard.writeText(content);ok=true;}catch{const a=document.createElement('textarea');a.value=content;document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}document.getElementById('copystatus').textContent=ok?'복사했습니다.':'자동 복사가 제한됩니다. 내용을 길게 눌러 선택해 복사하거나 PDF 저장을 이용하세요.';}if(b.hasAttribute('data-print'))window.print();});
function tick(){if(!state.started)return;const s=Math.max(0,1800-Math.floor((Date.now()-state.started)/1000));document.getElementById('clock').textContent=s?String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):'미팅 시작됨';}window.addEventListener('beforeunload',e=>{if(state.started){e.preventDefault();e.returnValue='';}});document.addEventListener('visibilitychange',tick);setInterval(tick,1000);render();
</script></body></html>
