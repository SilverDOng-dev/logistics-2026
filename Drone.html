const points={H:{x:0,y:0,name:'배송거점'},P1:{x:10,y:0,name:'마을회관'},P2:{x:0,y:20,name:'학교'},P3:{x:25,y:0,name:'공동창고'},P4:{x:0,y:40,name:'해양관측소'},P5:{x:60,y:0,name:'보건진료소'}};
const orders=[{id:'O1',point:'P1',item:'생활용품',weight:1,due:60},{id:'O2',point:'P2',item:'수업용 교구',weight:1.5,due:60},{id:'O3',point:'P3',item:'수리 부품',weight:1,due:75},{id:'O4',point:'P4',item:'관측 장비 부품',weight:2,due:60},{id:'O5',point:'P5',item:'긴급 의약품',weight:1,due:22,urgent:true}];
const distance=(a,b)=>Math.hypot(points[a].x-points[b].x,points[a].y-points[b].y)*.2;
function clock(t,seconds=false){if(t==null||!Number.isFinite(t))return '—';let s=Math.round((15*60+t)*60);return String(Math.floor(s/3600)%24).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+(seconds?':'+String(s%60).padStart(2,'0'):'');}
const minute=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m&&+m[1]<24&&+m[2]<60?+m[1]*60+(+m[2])-900:NaN;};
function basic(m,os=orders){const route=['H',...m.route,'H'];return{weight:m.orders.reduce((a,id)=>a+(os.find(o=>o.id===id)?.weight||0),0),km:route.slice(1).reduce((a,p,i)=>a+distance(route[i],p),0),time:route.slice(1).reduce((a,p,i)=>a+distance(route[i],p)+2,0)};}
function validate(ms,os=orders){const errors=[],seen=new Set();ms.forEach((m,i)=>{const n='임무 '+(i+1);if(!['D1','D2','D3'].includes(m.drone))errors.push(n+': 드론을 확인하세요.');if(!Number.isFinite(m.start)||m.start<0||m.start>120)errors.push(n+': 출발시각은 15:00~17:00으로 입력하세요.');if(!m.route.length||m.route.some(p=>!points[p]||p==='H'))errors.push(n+': 방문지는 P1~P5를 사용하세요.');if(!m.orders.length)errors.push(n+': 주문을 선택하세요.');m.orders.forEach(id=>{const o=os.find(o=>o.id===id);if(!o)errors.push(n+': 알 수 없는 주문 '+id);else if(!m.route.includes(o.point))errors.push(n+': '+id+' 배송지가 방문 순서에 없습니다.');if(seen.has(id))errors.push(id+': 다른 임무와 중복 배정되었습니다.');seen.add(id);});if(m.swapP5&&!m.route.includes('P5'))errors.push(n+': P5 교체를 선택했지만 방문 경로에 없습니다.');});return [...new Set(errors)];}
function simulate(input,options={}){
 const os=options.orders||orders,weather=options.weather||[30,45],slots=[...(options.slots||[0,0])],ds={D1:{ready:0,battery:100},D2:{ready:0,battery:100},D3:{ready:0,battery:100}},visits={},events=[],segments=[],results=[],delivery=Object.fromEntries(os.map(o=>[o.id,{status:'미배송',time:null}]));

 const weatherTime=t=>t>=weather[0]-1e-8&&t<weather[1]-1e-8?weather[1]:t;

 while(pending.length){
  pending.sort((a,b)=>{const available=m=>weatherTime(Math.max(Math.max(m.start,ds[m.drone].ready)+(m.swapH?3:0),Math.min(...slots)));return available(a)-available(b)||a.start-b.start||a.drone.localeCompare(b.drone)||a.idx-b.idx;});
  const m=pending.shift(),d=ds[m.drone],stats=basic(m,os),r={id:m.id,drone:m.drone,planned:m.start,start:null,end:null,battery:d.battery,status:'대기',orders:m.orders,route:m.route,reasons:[],km:stats.km};
  results.push(r);
  if(d.lost){r.status='출발 차단';r.reasons.push('이전 임무에서 기체 사용 불가');event(m.start,m,'blocked',r.reasons[0]);continue;}
  if(stats.weight>5){r.status='출발 차단';r.reasons.push('적재량 '+stats.weight+'kg: 5kg 초과');event(m.start,m,'blocked',r.reasons[0]);continue;}
  let ready=Math.max(m.start,d.ready),t=ready,b=d.battery,carried=[...m.orders],pos='H',dead=false;
  if(d.ready>m.start)r.reasons.push('이전 임무 복귀 대기');
  if(m.swapH){segments.push({drone:m.drone,mission:m.id,type:'교체',from:'H',to:'H',start:t,end:t+3,b0:b,b1:100});event(t,m,'swap','H 배터리 교체 시작 · 3분');t+=3;b=100;r.reasons.push('H 배터리 교체');}

  if(weatherTime(t)>t){r.reasons.push('H 기상 대기');event(t,m,'wait','풍속 11m/s · '+clock(weather[1])+'까지 H 대기');t=weatherTime(t);}

   const w=carried.reduce((sum,id)=>sum+os.find(o=>o.id===id).weight,0),rate=consume?2.5*(w>4?1.2:1):0,need=duration*rate,start=t,b0=b;
   if(rate&&need>b+1e-9){const elapsed=b/rate;segments.push({drone:m.drone,mission:m.id,type,from,to,start,end:t+elapsed,b0,b1:0,fraction:elapsed/duration,weight:w,rate});t+=elapsed;b=0;dead=true;r.status='불시착';r.reasons.push('귀환 또는 다음 구간 배터리 부족');event(t,m,'crash','배터리 0% · '+(from===to?from+' '+type+' 중':from+' → '+to+' 구간')+' 모의 불시착');return;}
   b=Math.max(0,b-need);t+=duration;segments.push({drone:m.drone,mission:m.id,type,from,to,start,end:t,b0,b1:b,fraction:1,weight:w,rate});
  }
  for(const dest of [...m.route,'H']){
   if(weatherTime(t)>t){const end=weatherTime(t);r.reasons.push(pos+' 기상 대기');event(t,m,'wait',pos+' 기상 대기 → '+clock(end));move('기상 대기',pos,pos,end-t,false);}
   move('이륙',pos,pos,1);if(dead)break;
   move('순항',pos,dest,distance(pos,dest));if(dead)break;
   move('착륙',dest,dest,1);if(dead)break;pos=dest;

ry"><i id="bar-D${i}" style="width:100%"></i></div></div>`).join('')}</div>`;}
function mapPanel(plans,result){return `<section class="panel"><div class="panel-head"><h2>운항 지도</h2><span class="tag">${result?'시험 운항':'출항 전'} · 슬롯 2개</span></div>${map(plans)}${result?`<div class="controls"><span class="simclock" id="sim-clock">15:00:00</span>${button('▶ 재생','play','small')}${button('다음 사건','next-event','small')}${button('끝으로','end','small')}<label class="sub">속도 <select id="speed" aria-label="재생 속도" style="width:65px;padding:4px"><option value="2">2×</option><option value="4" ${speed===4?'selected':''}>4×</option><option value="12">12×</option></select></label><input type="range" id="timeline" min="0" max="${result.duration}" step=".05" value="${playback}" aria-label="시뮬레이션 시각"></div>`:''}</section>`;}

function card(m,i){let b;try{b=E.basic(m)}catch{b={weight:0,km:0,time:0}}return `<div class="mission-card" data-card="${i}"><div class="mission-top"><div class="button-row"><span class="eyebrow">MISSION ${String(i+1).padStart(2,'0')}</span><select data-field="drone" data-i="${i}" aria-label="임무 ${i+1} 드론">${['D1','D2','D3'].map(d=>`<option ${m.drone===d?'selected':''}>${d}</option>`).join('')}</select></div>${button('삭제','remove-mission','small ghost',`data-i="${i}"`)}</div><div class="field"><label>실을 주문</label><div class="checks">${E.orders.map(o=>`<label><input type="checkbox" data-order="${o.id}" data-i="${i}" ${m.orders.includes(o.id)?'checked':''}>${o.id} <span class="sub">${o.point}</span></label>`).join('')}</div></div><div class="mission-fields"><div class="field"><label for="route-${i}">방문 순서</label><input type="text" id="route-${i}" data-field="route" data-i="${i}" value="${esc(m.route.join(', '))}" placeholder="P1, P2"></div><div class="field"><label for="start-${i}">예정 출발</label><input type="time" id="start-${i}" data-field="start" data-i="${i}" value="${E.clock(m.start)}"></div></div><div class="checks" style="margin-bottom:13px"><label><input type="checkbox" data-field="swapH" data-i="${i}" ${m.swapH?'checked':''}>H 출발 전 교체</label><label><input type="checkbox" data-field="swapP5" data-i="${i}" ${m.swapP5?'checked':''}>P5 교체</label></div><div class="metrics" id="metrics-${i}"><span>적재 <b>${b.weight.toFixed(1)}kg</b></span><span>거리 <b>${b.km.toFixed(1)}km</b></span><span>기본 <b>${b.time.toFixed(1)}분</b></span></div></div>`;}
function editor(){return `<section class="panel"><div class="panel-head"><h2>${state.first?'수정 운항안':'AI 운항안 입력'}</h2><span class="tag">${state.first?'재실행 1회':'최초 실행 전'}</span></div><div class="panel-body"><details ${!state.first?'open':''}><summary>AI에게 상황 전달하기</summary><p class="sub">배송 현황과 운영 기준을 복사해 AI에게 전달하세요. 답변은 아래에 붙여넣을 수 있습니다.</p><div class="button-row">${button('배송 현황 복사','copy-data','small')}${button('운영 기준 복사','copy-rules','small')}${button('요청문 복사','copy-prompt','small primary')}</div><div class="field" style="margin-top:12px"><label for="ai-text">AI 답변 붙여넣기 · JSON 또는 지정 순서 표</label><textarea id="ai-text" rows="4" placeholder='요청문에 포함된 JSON 형식이나 드론 | 주문 | 방문 순서 | 출발시각 | P5 교체 표를 붙여넣으세요.'>${esc(state.aiText)}</textarea></div><div class="button-row">${button('답변을 임무 카드로 변환','import','small primary')}${button('가까운 곳 우선 예시','preset-baseline','small')}${button('긴급 주문 우선 예시','preset-urgent','small')}</div><p class="note-line">예시는 제작자가 작성한 연습 자료입니다. 외부 AI 없이도 실습할 수 있습니다.</p></details><div id="input-errors" role="alert">${state.errors.length?`<div class="error-box">${state.errors.map(esc).join('<br>')}</div>`:''}</div><div class="editor-grid" style="margin-top:15px">${state.plan.map(card).join('')}</div><div class="button-row" style="margin-top:15px">${button('+ 임무 추가','add-mission','small')}${button(state.first?'수정안 시험 운항 · 마지막 1회':'▶ AI 운항안 시험 운항','run-r2','primary')}</div><p class="note-line">기본 시간은 대기·교체를 제외한 값입니다. 운항 가능 여부는 시험 운항에서 확인합니다.</p></div></section>`;}
function r2(){const r=state.second||state.first;return `${state.second?'<div class="callout">수정 전후 시험 운항을 마쳤습니다. 결과를 비교하고 돌발상황 대응으로 이동하세요.</div>':''}${r?resultKpis(r):''}<div class="stack">${!state.second?editor():''}<div class="workspace"><div class="stack">${mapPanel(state.second?state.finalPlan||state.plan:state.first?state.firstPlan||state.plan:state.plan,r)}${r?eventPanel(r):ordersTable()}</div><div class="stack">${panel('검증 메모',`${state.first?`<span class="tag">${state.second?'수정 실행 완료':'최초 실행 완료 · 수정 가능'}</span>`:'<p class="sub">AI가 제시한 계획을 카드로 확인한 뒤 시험 운항하세요.</p>'}${evidenceBox()}${note('observation','관찰 · 어떤 일이 발생했나요?','정상 실행된 조건도 근거와 함께 기록할 수 있습니다.')}${note('change','수정 · 무엇을 바꾸고 왜 바꾸나요?','원인과 수정할 항목을 연결하세요.')}${note('expectation','예상 · 어떤 결과가 달라질까요?','예: P5 단독 운항으로 의약품 마감을 지킬 수 있다.')}<details><summary>검토할 조건 확인</summary><p class="sub">적재량 / 귀환 배터리 / 운항 슬롯 / 모든 지점의 이륙 기상 / 긴급 주문 / 배터리 교체 / AI의 미확인 가정</p></details>`)}${state.second?panel('수정 결과',`<div class="fact"><span>전달 완료</span><b>${state.first.kpi.completed} → ${state.second.kpi.completed}건</b></div><div class="fact"><span>정시 완료</span><b>${state.first.kpi.onTime} → ${state.second.kpi.onTime}건</b></div><div class="fact"><span>불시착</span><b>${state.first.kpi.crashes} → ${state.second.kpi.crashes}회</b></div>${note('comparison','실제 결과는 예상과 같았나요?','달라진 결과 또는 그대로인 이유를 적으세요.')}`):panel('기상 예보',weather())}</div></div>${r?ordersTable(r)+missionResults(r):''}</div>`;}
const emergencyOrders=[{id:'E1',point:'P5',item:'긴급 의약품',weight:1,due:40,urgent:true},{id:'E2',point:'P2',item:'일반 물품',weight:1,due:90}];
function emergencyPlan(choice){return[{drone:'D3',orders:choice==='B'?['E2','E1']:['E1'],route:choice==='B'?['P2','P5']:['P5'],start:choice==='C'?60:20,swapH:false,swapP5:false}];}
function r3(){const r=state.r3;return `<div class="workspace"><div class="stack">${panel('15:05 · 보건진료소 긴급 요청',`<span class="tag urgent">신규 의약품 1kg · 15:40까지</span><p>운항 슬롯 2개를 D1과 D2가 사용 중입니다. D3는 거점에서 배터리 100%로 대기하고 있습니다.</p><div class="brief-grid"><div><small>D1 복귀 예정</small><strong>15:20</strong></div><div><small>D2 복귀 예정</small><strong>15:25</strong></div><div><small>이륙 제한 시작</small><strong>15:38</strong></div></div><p class="sub">P2 일반 물품 1kg도 대기 중입니다. 일반 물품 마감은 16:30입니다.</p>${weather(true)}`)}${r?mapPanel(emergencyPlan(state.choice),r):panel('세 가지 운항 선택',`<p class="sub">이 상황은 앞 단계의 결과와 무관하게 같은 조건에서 시작합니다.</p>${['A','B','C'].map((c,i)=>`<button class="choice ${state.choice===c?'selected':''}" data-action="choose" data-choice="${c}" aria-pressed="${state.choice===c}"><span class="choice-letter">${c}</span><span>${['15:20 · P5 단독 출발','15:20 · P2와 P5 묶음 배송','16:00 · 기상 회복 후 출발'][i]}<small>${['슬롯이 열리면 D3를 긴급 의약품 배송에 투입한다.','D3가 P2 일반 물품을 전달한 뒤 P5로 이동한다.','이륙 제한이 끝난 뒤 D3를 P5로 보낸다.'][i]}</small></span></button>`).join('')}`)}${r?eventPanel(r):''}</div><div class="stack">${panel('관제사의 판단',`${note('decision','이 결정을 선택한 이유','긴급도, 안전, 기상창 중 어떤 조건을 근거로 판단했나요?')}${!r?button('선택한 운항 실행 · 1회','run-r3','primary',state.choice?'':'disabled'):`<div class="callout ${r.delivery.E1.status==='정시 완료'?'':'orange'}"><b>선택 ${state.choice} · ${r.delivery.E1.status}</b><p>의약품 전달 ${E.clock(r.delivery.E1.time,true)}<br>드론 복귀 ${E.clock(r.missions[0].end,true)}</p></div><p class="sub">${state.choice==='A'?'P5에서 재이륙하는 15:35까지 기상창이 열려 있어 정시 전달과 귀환이 가능했습니다.':state.choice==='B'?'P2 경유로 의약품 마감을 넘겼습니다. P5에서는 기상 회복까지 기다려야 했습니다.':'기상 회복 후 출발해 운항은 완료했지만 긴급 의약품은 마감을 넘겼습니다.'}</p>${note('confirm','실제 출발 전에 추가로 확인할 정보','예: P5 현장 풍속, 수령 준비, 기체 상태…')}`}`)}${panel('이번 상황의 운항 조건',`<p class="sub">기상 예보가 유지된다고 가정합니다. 이미 이륙한 드론은 비행을 계속하고 착륙할 수 있습니다. 새 이륙은 모든 지점에서 제한됩니다.</p><p class="sub">실제 현장에서는 비행 중 기상 대응과 기체별 제한을 추가로 확인해야 합니다.</p>`)}</div></div>${r?missionResults(r):''}`;}
function compareTable(){if(!state.first||!state.second)return '<p class="sub">AI 운항안의 최초 실행과 수정 실행을 완료하면 비교표가 표시됩니다.</p>';const a=state.first,b=state.second,rows=[['전달 완료',r=>r.kpi.completed+'건'],['정시 완료율',r=>r.kpi.rate.toFixed(0)+'%'],['지연 완료',r=>Object.values(r.delivery).filter(o=>o.status==='지연 완료').length+'건'],['미배송·회수',r=>r.orders.length-r.kpi.completed+'건'],['정상 복귀',r=>r.missions.filter(m=>m.status==='정상 복귀').length+'회'],['모의 불시착',r=>r.kpi.crashes+'회'],['출격 임무',r=>r.kpi.sorties+'회'],['총 운영비',r=>r.kpi.cost.toLocaleString()+'원'],['완료 1건당 비용',r=>r.kpi.per===null?'산출 불가':Math.round(r.kpi.per).toLocaleString()+'원']];return `<div class="table-scroll"><table><thead><tr><th>운영 지표</th><th>최초 실행</th><th>수정 실행</th></tr></thead><tbody>${rows.map(([n,f])=>`<tr><td>${n}</td><td class="mono">${f(a)}</td><td class="mono">${f(b)}</td></tr>`).join('')}</tbody></table></div>`;}
function r4(){return `<div class="report-banner"><div class="eyebrow">SHIFT HANDOVER / 관제 업무 인계</div><h2>계획을 검증했다면, 근거를 남기세요.</h2><p>처음 주목한 문제: ${esc(state.notes.priority||'인수 확인 기록 없음')}</p></div><div class="split"><div class="stack"><section class="panel"><div class="panel-head"><h2>AI 운항안 · 수정 전후 비교</h2></div>${compareTable()}<div class="panel-body"><p class="note-line">정시 완료율은 전체 주문 5건 기준입니다. 비용은 R2 각 실행을 별도의 운영 세션으로 계산합니다.</p><details><summary>가상 운영비 계산 기준</summary><p class="sub">고정비 300,000원 + H 출격당 8,000원 + 불시착 기체당 3,000,000원. 중간 지점 재이륙과 배터리 교체 비용은 별도 가산하지 않습니다.</p></details><div class="callout orange">수업용 가상 운영조건에 따른 비용입니다. 실제 사업성 판단값이 아닙니다.</div></div></section>${panel('이번 활동에서 확보한 근거',state.evidence.length?state.evidence.map(e=>`<div class="evidence"><span>R${e.step} · ${esc(e.text)}</span></div>`).join(''):'<p class="sub">저장한 사건이 없습니다. 앞 단계 운항 기록에서 근거를 추가할 수 있습니다.</p>')}</div><div class="stack">${panel('관제 인계서',`<div class="field"><label for="student">이름 / 조 이름 <span class="sub">선택</span></label><input id="student" type="text" data-note="student" value="${esc(state.notes.student||'')}" placeholder="예: 3조"></div>${note('reportProblem','확인한 주요 문제','운영 문제와 영향을 요약하세요.')}${note('reportEvidence','근거가 된 운항 기록','시각, 드론, 배터리 또는 배송 결과를 인용하세요.')}${note('reportChange','수정한 내용과 결과','무엇을 바꿨고 어떤 차이가 생겼나요?')}${note('reportNext','다음 담당자가 확인해야 할 사항','아직 해결되지 않은 조건이나 확인할 정보를 적으세요.')}<div class="button-row">${button('인계서 완료','complete','primary')}${button('결과 내려받기','download','small')}${button('인쇄 / PDF','print','small')}</div>`)}</div></div>${state.done?'<div class="completion"><span class="tag success">30분 관제 실무 체험 완료</span><h2>인계 기록이 저장되었습니다.</h2><p>AI 운항안은 날려 보기 전까지 계획이고,<br>날려 본 뒤에는 데이터다.</p></div>':''}`;}
function render(){const result=activeResult();$('#app').innerHTML=`<header><div class="brand"><span class="brand-icon">↗</span>ISLAND OPS <small>섬 배송거점 관제실</small></div><div class="header-right"><span>3주차 · 실무 체험</span><span class="timer" id="elapsed">00:00 / 30분</span>${button('운영 기준','rules','small')}</div></header><div class="shell"><aside><div class="side-title"><span class="eyebrow">TRAINING 03</span><br>AI 운항안 검증</div><nav class="steps" aria-label="실습 단계">${steps.map((s,i)=>`<button class="step ${state.step===i?'active':''}" data-action="goto" data-step="${i}" ${state.step===i?'aria-current="step"':''}><span class="step-num">${i+1}</span><span><strong>${s}</strong><small>R${i} · 권장 ${times[i]}분</small></span></button>`).join('')}</nav><div class="side-bottom"><b>당신은 관제 담당자입니다.</b><p>계획을 실행하고,<br>수치로 확인하고,<br>판단의 근거를 남기세요.</p><p>이 브라우저에 자동 저장</p>${button('실습 초기화','reset','small ghost')}</div></aside><main><div class="page-top"><div><div class="eyebrow">R${state.step} / ${String(state.step+1).padStart(2,'0')} OF 05 <span style="margin-left:10px">${times[state.step]} MIN</span></div><h1>${titles[state.step]}</h1><p class="sub">${subtitles[state.step]}</p></div><div class="button-row"><span class="tag">학생용 실습</span>${button('교수자 안내','teacher','small ghost')}</div></div>${[r0,r1,r2,r3,r4][state.step]()}<div class="bottom-nav"><p>${['인수 확인을 마치면 기존 운항안을 점검하세요.','문제를 설명할 증거 두 개를 기록하세요.','첫 실행 → 검증 → 수정 실행 순서로 진행하세요.','선택 이유와 추가 확인사항을 남기세요.','결과를 내려받아 수업 제출물로 사용할 수 있습니다.'][state.step]}</p><div class="button-row">${state.step?button('이전','prev','ghost'):''}${state.step<4?button(steps[state.step+1]+' →','next','primary'):''}</div></div><div class="footer-note">교육용 가상 운항 조건 · 실제 드론을 제어하지 않습니다.</div></main></div>`;bind();updateClock();if(result)paintPlayback(result);}
function updateClock(){const el=$('#elapsed');if(el){const sec=Math.floor(state.elapsedSeconds||0);el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')+' / 30분';}}
function paintPlayback(r){const clock=$('#sim-clock');if(clock)clock.textContent=E.clock(playback,true);if($('#timeline'))$('#timeline').value=playback;$$('[data-time]').forEach(el=>el.classList.toggle('future',+el.dataset.time>playback+.001));const markers=[];
 for(const drone of ['D1','D2','D3']){let point=coords('H'),bat=100,label='H · 출발 대기';const segs=r.segments.filter(s=>s.drone===drone&&s.start<=playback).sort((a,b)=>a.start-b.start);const s=segs.at(-1);if(s){const f=Math.min(1,Math.max(0,(playback-s.start)/(s.end-s.start||1))),a=coords(s.from),b=coords(s.to);point={x:a.x+(b.x-a.x)*f*(s.fraction??1),y:a.y+(b.y-a.y)*f*(s.fraction??1)};bat=s.type==='배터리 교체'||s.type==='교체'?(f>=1?s.b1:s.b0):s.b0+(s.b1-s.b0)*f;label=f<1?s.type+' · '+s.from+(s.from!==s.to?' → '+s.to:''):s.to+' · 지상 대기';const last=r.missions.filter(m=>m.drone===drone&&m.end!==null&&m.end<=playback).sort((a,b)=>a.end-b.end).at(-1);if(last&&last.end>=s.end-.001)label=last.status;}
  const el=$('#bat-'+drone);if(el)el.textContent=bat.toFixed(0)+'%';if($('#bar-'+drone))$('#bar-'+drone).style.width=Math.max(0,bat)+'%';if($('#status-'+drone))$('#status-'+drone).textContent=label;
  const color=['#147c79','#4776b1','#a56a20'][+drone[1]-1],offset=!s?(+drone[1]-2)*20:0;markers.push(`<g transform="translate(${point.x+offset},${point.y-20})"><circle r="11" fill="${label==='불시착'?'#bc4234':color}" stroke="white" stroke-width="2"/><text text-anchor="middle" y="4" fill="white" font-size="10" font-weight="700">${label==='불시착'?'×':drone}</text></g>`);
 }if($('#drone-markers'))$('#drone-markers').innerHTML=markers.join('');
 const marks=[];for(const s of r.segments){if(s.b1>=s.b0)continue;for(const threshold of [20,10,0]){if(s.b0>threshold&&s.b1<=threshold){const f=(s.b0-threshold)/(s.b0-s.b1),time=s.start+(s.end-s.start)*f;if(time>playback)continue;const a=coords(s.from),b=coords(s.to),x=a.x+(b.x-a.x)*f*(s.fraction??1),y=a.y+(b.y-a.y)*f*(s.fraction??1);marks.push(`<g><circle cx="${x}" cy="${y}" r="5" fill="${threshold?'#c57c28':'#bc4234'}"/><text x="${x+7}" y="${y-6}" font-size="10" fill="#974724">${threshold}%</text><title>${s.drone} ${E.clock(time,true)} · ${s.type} · 적재 ${s.weight}kg · 분당 ${s.rate}%</title></g>`);}}}if($('#battery-marks'))$('#battery-marks').innerHTML=marks.join('');}
function stop(){playing=false;clearInterval(playTimer);playTimer=null;}

function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action,el.dataset)));$$('[data-note]').forEach(el=>el.addEventListener('input',()=>{state.notes[el.dataset.note]=el.value;save();}));$$('[data-check]').forEach(el=>el.addEventListener('change',()=>{state.checks=$$('[data-check]:checked').map(x=>x.dataset.check);save();}));$('#ai-text')?.addEventListener('input',e=>{state.aiText=e.target.value;save();});$$('[data-field]').forEach(el=>el.addEventListener('change',()=>{const m=state.plan[+el.dataset.i],f=el.dataset.field;m[f]=f==='route'?el.value.toUpperCase().split(/[,\s→>\-]+/).filter(Boolean).filter(x=>x!=='H'):f==='start'?E.minute(el.value):el.type==='checkbox'?el.checked:el.value;save();refreshMetrics(+el.dataset.i);}));$$('[data-order]').forEach(el=>el.addEventListener('change',()=>{const i=+el.dataset.i;state.plan[i].orders=$$('[data-order][data-i="'+i+'"]:checked').map(x=>x.dataset.order);save();refreshMetrics(i);}));$('#timeline')?.addEventListener('input',e=>{stop();playback=+e.target.value;paintPlayback(activeResult());$('[data-action=play]').textContent='▶ 재생';});$('#speed')?.addEventListener('change',e=>speed=+e.target.value);}

function rulesText(){return `교육용 규칙: 최대 적재량 5kg. 현재 적재량이 4kg 초과이면 배터리 소모 20% 증가. 순항속도 1km/분. 이륙·착륙 각 1분. 비행·이륙·착륙 1분당 배터리 2.5% 소비. 배송은 착륙 완료 시 처리하고 적재에서 차감. 지상 대기는 배터리 소비 없음. H 교체 3분, P5 교체 5분, 계획에 지정한 경우만 100%로 교체. 운항 슬롯은 2개이며 H 출발부터 H 복귀까지 중간 지상 대기 중에도 유지. 예정 출발이 겹치면 예정시각·드론번호·임무번호 순서. 풍속 10m/s 이상이면 모든 지점에서 새 이륙 불가, 기상 회복까지 지상 대기. 이미 이륙한 구간과 착륙은 허용. 예보: 15:00~15:30 미만 6m/s, 15:30~15:45 미만 11m/s, 이후 7m/s. P3 첫 방문은 부재, 지상 5분 대기 후 화물 회수하고 경로 계속, 화물 무게 유지. 임무 경로는 H에서 시작해 H로 귀환. 같은 주문 중복 배정 불가. 같은 드론의 후속 임무는 복귀 후 실행, 배터리 잔량을 이어받음. 최적화보다 실행 가능성 검증이 목적.`;}
function promptText(){return `너는 도서지역 드론 배송거점의 운항계획 보조 담당자다. 제공된 정보를 보고 드론 3대의 운항 초안을 만들어줘. 불확실한 가정은 설명해줘.\n\n[배송 현황과 운영 기준을 여기에 붙여넣기]\n\n답변 첫 부분은 아래 구조의 JSON 배열로 작성하고 판단 이유는 배열 뒤에 설명해줘. 각 객체는 임무 1개이며 필요하면 여러 임무를 작성해도 돼.\n[{"drone":"D1","orders":["O5"],"route":["P5"],"start":"15:00","swapP5":false,"swapH":false}]\nroute에는 H를 제외한 방문 순서를 쓰고, 교체가 필요하면 해당 값을 true로 지정해줘. 주문 중복 배정은 하지 마. 모든 임무는 H로 돌아오는 것으로 계산해줘.`;}
function parseAnswer(text){let arr;const start=text.indexOf('[');if(start>=0){let depth=0,end=-1,inString=false,escape=false;for(let i=start;i<text.length;i++){const c=text[i];if(escape){escape=false;continue;}if(c==='\\'&&inString){escape=true;continue;}if(c==='"'){inString=!inString;continue;}if(!inString){if(c==='[')depth++;if(c===']'&&--depth===0){end=i+1;break;}}}if(end>0){try{arr=JSON.parse(text.slice(start,end));}catch{throw Error('JSON 형식을 확인하세요. 따옴표와 쉼표를 확인하거나 임무 카드에서 직접 입력하세요.');}}}
 if(!arr){const lines=text.split('\n').filter(l=>/D[123]/i.test(l)&&l.includes('|'));if(!lines.length)throw Error('인식할 임무가 없습니다. 요청문의 JSON 형식 또는 드론 | 주문 | 방문 순서 | 출발시각 | P5 교체 표를 사용하세요.');arr=lines.map(l=>{const cols=l.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim().replace(/\*\*/g,''));if(cols.length!==5)throw Error('표는 드론 | 주문 | 방문 순서 | 출발시각 | P5 교체 5열이어야 합니다.');const flag=cols[4];if(!/^(true|false|예|아니오|있음|없음)$/i.test(flag))throw Error('표의 P5 교체 여부는 예 또는 아니오로 명시하세요.');return{drone:cols[0],orders:cols[1].match(/O\d+/g)||[],route:(cols[2].match(/P[1-5]/g)||[]),start:cols[3],swapP5:/^(true|예|있음)$/i.test(flag),swapH:false};});}
 if(!Array.isArray(arr)||!arr.length||arr.length>9)throw Error('임무는 1~9개로 입력하세요.');return arr.map((m,i)=>{if(!Array.isArray(m.orders)||!Array.isArray(m.route)||typeof m.swapP5!=='boolean'||typeof m.swapH!=='boolean')throw Error('임무 '+(i+1)+': orders와 route 배열, swapP5와 swapH의 true/false를 확인하세요.');return{drone:String(m.drone).toUpperCase(),orders:m.orders.map(String),route:m.route.map(String).filter(p=>p!=='H'),start:E.minute(m.start),swapP5:m.swapP5,swapH:m.swapH};});}

async function act(action,d={}){

 if(action==='teacher'){showModal('교수자 진행 안내 · 30분',`<table><thead><tr><th>시간</th><th>진행</th></tr></thead><tbody><tr><td>0–4분</td><td>관제 인수 · 우선 주문과 운영조건 기록</td></tr><tr><td>4–9분</td><td>기존 계획 실행 · 증거 2개 저장</td></tr><tr><td>9–21분</td><td>AI 계획 입력 · 최초 실행 · 수정 1회</td></tr><tr><td>21–26분</td><td>돌발상황 선택 · 판단 근거 작성</td></tr><tr><td>26–30분</td><td>결과 비교 · 인계서 제출</td></tr></tbody></table><p>2인 1조라면 관제 담당과 검증 담당을 나누고 수정 단계에서 역할을 바꿉니다. AI 접속이 어려우면 사전 작성 예시를 사용합니다.</p><details><summary>교수자용 기준 결과 보기</summary><p>R1: D1 약 16.47분 복귀, D2 19분 회수 복귀. D3는 슬롯과 기상을 기다리고 긴급 의약품 마감을 넘기며 귀환 중 배터리가 소진됩니다.</p><p>R3: A는 15:34 전달·15:48 복귀. B는 약 15:40:39 전달·16:14 복귀. C는 16:14 전달·16:28 복귀.</p></details><p class="sub">평가: 상황 파악 2점 / 증거 해석 3점 / 수정 근거 3점 / 인계 2점. 배송 건수만으로 평가하지 않습니다.</p>`);return;}

 if(action==='preset-baseline'||action==='preset-urgent'){if(state.second)return;state.plan=action==='preset-baseline'?E.baseline():E.urgent();state.errors=[];save();stop();render();toast('사전 작성 예시를 불러왔습니다. 임무 카드를 확인하세요.');return;}
