<script>
'use strict';
const VERSION='1.0';
const Z=[{id:'A',name:'중앙 주상복합',n:400,x:4.5,y:3.5,abs:.10,eff:1,desc:'밀집 주거 · 차량 부재 10%'},{id:'B',name:'대학가 원룸촌',n:350,x:2,y:3.5,abs:.40,eff:1,desc:'낮 시간 부재 · 차량 부재 40%'},{id:'C',name:'대단지 아파트',n:500,x:4.6,y:1.5,abs:.12,eff:.85,desc:'공동현관 · 로봇 1층 수령 실패 15%'},{id:'D',name:'구도심 저층',n:150,x:1.4,y:1.3,abs:.08,eff:.50,desc:'보도 미정비 · 로봇 효율 50%'},{id:'E',name:'오피스텔',n:300,x:6.7,y:4.4,abs:.25,eff:1,desc:'야간 수요 · 차량 건당 1,000원 추가'},{id:'F',name:'전원주택',n:60,x:7.2,y:1.3,abs:.05,eff:.40,desc:'분산 주거 · 로봇 효율 40%'}];
const M=[{id:'M1',x:4.5,y:2.6,cost:300000000},{id:'M2',x:2.9,y:2.5,cost:220000000},{id:'M3',x:6.1,y:3.3,cost:250000000}];
const L=[{id:'L1',zone:'A',x:5.15,y:3.5},{id:'L2',zone:'B',x:2.65,y:3.5},{id:'L3',zone:'E',x:7.35,y:4.4},{id:'L4',zone:'D',x:2.05,y:1.3}];
const METHODS=['v','r','l','t'], NAMES={v:'차량',r:'로봇',l:'락커',t:'임시 수령'}, COLORS={v:'#8a8a8a',r:'#2d5fa8',l:'#2e6b36',t:'#e8a33d'};

let animation=null, reportCanvases=[], reportStamp='',dirty=false;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',4200)}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()}
function download(data,name,type='application/octet-stream'){const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function filename(ext){return '라스트마일_설계보고서_'+(S.student.id+'_'+S.student.name).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,100)+'.'+ext}
function total(a){return METHODS.reduce((s,k)=>s+a[k],0)}
function installation(p){return (M.find(m=>m.id===p.m)?.cost||0)+p.lock.length*20000000}

 });
 logs.sort((a,b)=>a.time.localeCompare(b.time));const sum=k=>rows.reduce((s,r)=>s+r[k],0),complete=sum('complete'),cost=Object.values(costs).reduce((s,n)=>s+n,0);

function buildReport(){const pages=[];let c,canvas,y,title;const W=1240,H=1754,margin=82,bottom=1625;function newPage(t,continued=false){canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;canvas.setAttribute('aria-label',t+' 보고서 페이지');pages.push(canvas);c=canvas.getContext('2d');c.fillStyle='white';c.fillRect(0,0,W,H);c.fillStyle='#1b3a6b';c.fillRect(0,0,W,15);c.font='bold 19px "Malgun Gothic",sans-serif';c.fillText('H몰 / K신도시 프로젝트',margin,72);c.font='bold 36px "Malgun Gothic",sans-serif';c.fillText(t+(continued?' · 계속':''),margin,138);c.strokeStyle='#d8e1eb';c.beginPath();c.moveTo(margin,168);c.lineTo(W-margin,168);c.stroke();y=210}

function makePDF(pages){if(!pages.length)throw Error('보고서를 먼저 생성하세요.');const enc=new TextEncoder(),parts=[],offsets=[0];let offset=0;const add=b=>{const a=typeof b==='string'?enc.encode(b):b;parts.push(a);offset+=a.length};const obj=(id,body)=>{offsets[id]=offset;add(id+' 0 obj\n');add(body);add('\nendobj\n')};add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');pages.forEach((p,i)=>{const id=3+i*3,raw=atob(p.toDataURL('image/jpeg',.90).split(',')[1]),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));obj(id,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+(id+1)+' 0 R >> >> /Contents '+(id+2)+' 0 R >>');offsets[id+1]=offset;add((id+1)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.width+' /Height '+p.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');add(bytes);add('\nendstream\nendobj\n');const content='q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ';obj(id+2,'<< /Length '+enc.encode(content).length+' >>\nstream\n'+content+'\nendstream')});const xref=offset,count=3+pages.length*3;add('xref\n0 '+count+'\n0000000000 65535 f \n');for(let i=1;i<count;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add('trailer\n<< /Size '+count+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
